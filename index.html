<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Survival: Knockback Update</title>
    <style>
        body {
            margin: 0; background: #000;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
            user-select: none; touch-action: none; color: white;
        }

        #gameContainer {
            position: relative; width: 100vh; max-width: 56.25vh; height: 100vh;
            background: #111;
            overflow: hidden; box-shadow: 0 0 30px rgba(0,210,211,0.2);
        }

        canvas { display: block; width: 100%; height: 100%; }

        #uiLayer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; padding: 20px; box-sizing: border-box;
            display: flex; flex-direction: column; justify-content: space-between;
        }

        /* Top UI */
        .top-ui { width: 100%; }
        #expBarContainer {
            width: 100%; height: 10px; background: #333;
            border-radius: 5px; overflow: hidden; margin-bottom: 5px; border: 1px solid #555;
        }
        #expBar { height: 100%; width: 0%; background: #00d2d3; transition: width 0.2s; }
        .stats { display: flex; justify-content: space-between; font-weight: bold; font-size: 14px; text-shadow: 1px 1px 2px black; }

        /* Combo & Warning */
        #centerMsg {
            position: absolute; top: 18%; left: 50%; transform: translateX(-50%);
            text-align: center; width: 100%; pointer-events: none;
        }
        #comboCount { 
            font-size: 48px; font-weight: 900; color: #fffa65; 
            text-shadow: 0 0 10px rgba(255, 165, 2, 0.8);
            display: none; transition: transform 0.1s;
        }
        #warningMsg {
            color: #ff4757; font-size: 26px; font-weight: 900;
            text-shadow: 0 0 15px red; display: none;
            animation: blink 0.5s infinite alternate;
            margin-top: 20px;
        }
        @keyframes blink { from { opacity: 1; transform: scale(1); } to { opacity: 0.5; transform: scale(1.1); } }

        /* Bottom UI */
        .bottom-ui { width: 100%; margin-bottom: 20px; }
        .gauge-wrap {
            width: 100%; height: 20px; background: #222; border-radius: 10px;
            overflow: hidden; border: 2px solid #444; position: relative;
        }
        #hyperBar { height: 100%; width: 0%; background: linear-gradient(90deg, #6c5ce7, #a29bfe); }
        #hyperText {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            font-size: 11px; font-weight: bold; text-shadow: 1px 1px 1px #000;
        }

        /* Modals */
        .modal {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: none;
            flex-direction: column; justify-content: center; align-items: center;
            pointer-events: auto; z-index: 100;
        }
        .card {
            background: white; color: #333; width: 85%; margin: 8px; padding: 15px;
            border-radius: 12px; cursor: pointer; text-align: center;
            box-shadow: 0 4px 0 #bdc3c7; transition: transform 0.1s;
        }
        .card:active { transform: translateY(4px); box-shadow: none; }
        
        .hyper-active #gameContainer { animation: shake 0.2s infinite; }
        @keyframes shake { 0% { transform: translate(1px, 1px); } 50% { transform: translate(-1px, -1px); } 100% { transform: translate(1px, -1px); } }

    </style>
</head>
<body>

<div id="gameContainer">
    <canvas id="gameCanvas"></canvas>
    
    <div id="uiLayer">
        <div class="top-ui">
            <div id="expBarContainer"><div id="expBar"></div></div>
            <div class="stats">
                <span id="lvText">LV. 1</span>
                <span id="hpText" style="color:#ff7675;">HP: 100</span>
            </div>
        </div>
        
        <div id="centerMsg">
            <div id="comboCount">0 COMBO</div>
            <div id="warningMsg">⚠ WARNING ⚠<br>BOSS APPROACHING</div>
        </div>

        <div class="bottom-ui">
            <div style="font-size:12px; color:#a29bfe; margin-bottom:4px;">HYPER GAUGE</div>
            <div class="gauge-wrap">
                <div id="hyperBar"></div>
                <div id="hyperText">0%</div>
            </div>
        </div>
    </div>

    <div id="levelUpScreen" class="modal">
        <h2 style="color:#fdcb6e; margin-bottom:20px;">LEVEL UP!</h2>
        <div id="cardsBox" style="width:100%; display:flex; flex-direction:column; align-items:center;"></div>
    </div>

    <div id="gameOverScreen" class="modal">
        <h1 style="color: #ff7675;">YOU DIED</h1>
        <h3 id="resultText" style="color:white; margin-bottom: 30px;"></h3>
        <button onclick="location.reload()" style="padding:15px 40px; font-size:20px; border-radius:30px; border:none; background:#00d2d3; color:white; font-weight:bold; cursor:pointer;">RETRY</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    // UI Refs
    const expBar = document.getElementById('expBar');
    const lvText = document.getElementById('lvText');
    const hpText = document.getElementById('hpText');
    const comboEl = document.getElementById('comboCount');
    const warnEl = document.getElementById('warningMsg');
    const hyperBar = document.getElementById('hyperBar');
    const hyperText = document.getElementById('hyperText');
    const levelUpScreen = document.getElementById('levelUpScreen');
    const cardsBox = document.getElementById('cardsBox');
    const gameOverScreen = document.getElementById('gameOverScreen');
    const resultText = document.getElementById('resultText');

    // Config
    const CW = 360, CH = 640;
    canvas.width = CW; canvas.height = CH;

    // Game State
    let gameState = 'PLAY';
    let frameCount = 0;

    const player = {
        wx: 0, wy: 0, // World Coord
        r: 8, hitR: 4, grazeR: 40, // 그레이즈 범위 약간 상향
        color: '#00d2d3',
        hp: 100, maxHp: 100,
        speed: 3.5, baseSpeed: 3.5, // 플레이어 기본 속도 약간 상향
        damage: 10,
        fireRate: 25, baseFireRate: 25, // 연사 속도 약간 상향
        bulletCount: 1,
        magnet: 80,
        level: 1, exp: 0, nextExp: 10,
        combo: 0, comboTimer: 0,
        hyperGauge: 0, isHyper: false, hyperTime: 0,
        lastShot: 0
    };

    // Input (Virtual Joystick)
    let isTouch = false;
    let startX=0, startY=0;
    let moveVx=0, moveVy=0;

    function inputStart(x, y) {
        if(gameState!=='PLAY') return;
        isTouch=true; startX=x; startY=y;
    }
    function inputMove(x, y) {
        if(!isTouch || gameState!=='PLAY') return;
        const dx = x - startX;
        const dy = y - startY;
        const angle = Math.atan2(dy, dx);
        const dist = Math.min(60, Math.hypot(dx, dy));
        const power = dist / 60;
        moveVx = Math.cos(angle) * power;
        moveVy = Math.sin(angle) * power;
    }
    function inputEnd() { isTouch=false; moveVx=0; moveVy=0; }

    canvas.addEventListener('mousedown', e=>inputStart(e.clientX, e.clientY));
    window.addEventListener('mousemove', e=>inputMove(e.clientX, e.clientY));
    window.addEventListener('mouseup', inputEnd);
    canvas.addEventListener('touchstart', e=>{e.preventDefault(); inputStart(e.touches[0].clientX, e.touches[0].clientY)}, {passive:false});
    window.addEventListener('touchmove', e=>{if(isTouch){e.preventDefault(); inputMove(e.touches[0].clientX, e.touches[0].clientY)}}, {passive:false});
    window.addEventListener('touchend', inputEnd);

    // Entities
    const enemies = [];
    const bullets = [];
    const gems = [];
    const texts = [];

    // Helper: Pool
    function getObj(arr, Class) {
        let o = arr.find(x=>!x.active);
        if(!o) { o=new Class(); arr.push(o); }
        return o;
    }

    class Enemy {
        constructor() { this.active=false; }
        spawn(isElite) {
            const angle = Math.random() * Math.PI * 2;
            const dist = 480; // 화면 밖
            this.wx = player.wx + Math.cos(angle)*dist;
            this.wy = player.wy + Math.sin(angle)*dist;
            this.isElite = isElite;
            this.active = true;
            this.grazeCool = 0;
            
            if(isElite) {
                // 너프된 보스 스펙
                this.hp = 150 + player.level*20; // 체력 감소
                this.maxHp = this.hp;
                this.speed = player.baseSpeed * 0.85; // 중요: 플레이어보다 느림!
                this.r = 25; // 덩치 키움 (맞추기 쉽게)
                this.color = '#e17055'; 
                this.xp = 50;
            } else {
                this.hp = 15 + player.level*4;
                this.speed = 1.5 + Math.random();
                this.r = 10; this.color = '#ff6b81'; this.xp = 5;
            }
        }
        update() {
            // 추적
            const angle = Math.atan2(player.wy - this.wy, player.wx - this.wx);
            this.wx += Math.cos(angle)*this.speed;
            this.wy += Math.sin(angle)*this.speed;
            if(this.grazeCool>0) this.grazeCool--;

            const dist = Math.hypot(player.wx-this.wx, player.wy-this.wy);
            
            // Hit Player
            if(dist < player.hitR + this.r) {
                player.hp -= (this.isElite?25:10); // 데미지 소폭 감소
                spawnText("-HP", player.wx, player.wy, 'red');
                if(!this.isElite) this.active=false;
                player.combo=0; updateUI();
                if(player.hp<=0) gameOver();
            }
            // Graze
            else if(dist < player.grazeR + this.r && this.grazeCool<=0) {
                addCombo(1);
                addHyper(this.isElite?5:1);
                this.grazeCool=30;
            }
            if(dist > 1000) this.active=false;
        }
        draw() {
            const sx = this.wx - player.wx + CW/2;
            const sy = this.wy - player.wy + CH/2;
            if(sx<-60||sx>CW+60||sy<-60||sy>CH+60) return;
            
            ctx.beginPath(); ctx.arc(sx, sy, this.r, 0, Math.PI*2);
            ctx.fillStyle = this.color; ctx.fill();
            if(this.isElite) {
                ctx.lineWidth=3; ctx.strokeStyle='#fff'; ctx.stroke();
                // 체력바
                const pct = this.hp / this.maxHp;
                ctx.fillStyle = 'red'; ctx.fillRect(sx-20, sy-40, 40, 6);
                ctx.fillStyle = '#00d2d3'; ctx.fillRect(sx-20, sy-40, 40*pct, 6);
            }
        }
    }

    class Bullet {
        constructor() { this.active=false; }
        spawn(wx, wy, a) {
            this.wx=wx; this.wy=wy; 
            this.vx=Math.cos(a)*8; this.vy=Math.sin(a)*8; // 탄속 증가
            this.active=true; this.life=50;
            this.r = player.isHyper ? 8 : 4;
        }
        update() {
            this.wx+=this.vx; this.wy+=this.vy;
            this.life--; if(this.life<=0) this.active=false;
        }
        draw() {
            const sx = this.wx - player.wx + CW/2;
            const sy = this.wy - player.wy + CH/2;
            if(sx<-10||sx>CW+10||sy<-10||sy>CH+10) return;
            ctx.fillStyle = player.isHyper?'#fffa65':'#00d2d3';
            ctx.beginPath(); ctx.arc(sx, sy, this.r, 0, Math.PI*2); ctx.fill();
        }
    }

    class Gem {
        constructor() { this.active=false; }
        spawn(wx, wy, v) { this.wx=wx; this.wy=wy; this.val=v; this.active=true; }
        update() {
            const dist = Math.hypot(player.wx-this.wx, player.wy-this.wy);
            let range = player.magnet;
            let spd = 7;
            if(player.isHyper) { range=1200; spd=15; } // 하이퍼때 자석 강화
            
            if(dist < range) {
                const a = Math.atan2(player.wy-this.wy, player.wx-this.wx);
                this.wx += Math.cos(a)*spd;
                this.wy += Math.sin(a)*spd;
                if(dist < 20) {
                    addExp(this.val);
                    this.active=false;
                }
            }
            if(dist > 1200) this.active=false;
        }
        draw() {
            const sx = this.wx - player.wx + CW/2;
            const sy = this.wy - player.wy + CH/2;
            if(sx<-10||sx>CW+10||sy<-10||sy>CH+10) return;
            ctx.fillStyle='#55efc4';
            ctx.beginPath(); ctx.arc(sx, sy, 6, 0, Math.PI*2); ctx.fill();
        }
    }

    class FloatText {
        constructor() { this.active=false; }
        spawn(t, wx, wy, c) { this.t=t; this.wx=wx; this.wy=wy; this.c=c; this.life=40; this.active=true; }
        update() { this.wy-=1; this.life--; if(this.life<=0) this.active=false; }
        draw() {
            const sx = this.wx - player.wx + CW/2;
            const sy = this.wy - player.wy + CH/2;
            ctx.fillStyle=this.c; ctx.font="bold 14px Arial"; ctx.fillText(this.t, sx, sy);
        }
    }

    function spawnText(t, wx, wy, c) { getObj(texts, FloatText).spawn(t, wx, wy, c); }
    function spawnBullet(wx, wy, a) { getObj(bullets, Bullet).spawn(wx, wy, a); }

    // Logic
    function addCombo(n) {
        player.combo += n;
        player.comboTimer = 120;
        comboEl.style.display = 'block';
        comboEl.innerText = player.combo + " COMBO";
        comboEl.style.transform = 'scale(1.2)';
        setTimeout(()=>comboEl.style.transform='scale(1)', 100);
    }
    
    function addHyper(n) {
        if(player.isHyper) return;
        player.hyperGauge = Math.min(100, player.hyperGauge+n);
        if(player.hyperGauge>=100) {
            player.isHyper=true; player.hyperTime=300;
            document.body.classList.add('hyper-active');
            spawnText("HYPER MODE!", player.wx, player.wy-40, "#fffa65");
        }
        updateUI();
    }

    function addExp(n) {
        player.exp += n;
        if(player.exp >= player.nextExp) {
            player.level++;
            player.exp=0; 
            player.nextExp = Math.floor(player.nextExp*1.4);
            levelUp();
        }
        updateUI();
    }

    function updateUI() {
        expBar.style.width = (player.exp/player.nextExp)*100 + "%";
        lvText.innerText = "LV. " + player.level;
        hpText.innerText = "HP: " + Math.floor(player.hp);
        hyperBar.style.width = player.hyperGauge + "%";
        hyperText.innerText = player.isHyper ? "!!! RUN !!!" : Math.floor(player.hyperGauge)+"%";
    }

    function drawGrid() {
        ctx.fillStyle = '#111';
        ctx.fillRect(0, 0, CW, CH);
        
        ctx.strokeStyle = '#222';
        ctx.lineWidth = 2;
        ctx.beginPath();
        const sz = 60;
        const offX = ((player.wx % sz) + sz) % sz;
        const offY = ((player.wy % sz) + sz) % sz;
        for(let x = -offX; x < CW; x += sz) { ctx.moveTo(x, 0); ctx.lineTo(x, CH); }
        for(let y = -offY; y < CH; y += sz) { ctx.moveTo(0, y); ctx.lineTo(CW, y); }
        ctx.stroke();
    }

    function update() {
        if(gameState!=='PLAY') return;
        frameCount++;

        // Move
        const spd = player.isHyper ? player.baseSpeed*1.5 : player.baseSpeed;
        player.wx += moveVx * spd;
        player.wy += moveVy * spd;

        // Hyper & Combo
        if(player.isHyper) {
            player.hyperTime--;
            player.hyperGauge = (player.hyperTime/300)*100;
            if(player.hyperTime<=0) {
                player.isHyper=false; player.hyperGauge=0;
                document.body.classList.remove('hyper-active');
            }
            updateUI();
        }
        if(player.combo>0) {
            player.comboTimer--;
            if(player.comboTimer<=0) { player.combo=0; comboEl.style.display='none'; }
        }

        // Fire
        const fr = player.isHyper ? 4 : player.baseFireRate;
        if(frameCount - player.lastShot > fr) {
            // Target Nearest
            let t=null, min=Infinity;
            enemies.forEach(e=>{
                if(!e.active) return;
                const d = Math.hypot(player.wx-e.wx, player.wy-e.wy);
                if(d<min) { min=d; t=e; }
            });
            if(t && min<400) {
                const a = Math.atan2(t.wy-player.wy, t.wx-player.wx);
                const spread = 0.2;
                const startA = a - (spread*(player.bulletCount-1))/2;
                for(let i=0; i<player.bulletCount; i++) {
                    spawnBullet(player.wx, player.wy, startA + spread*i);
                }
                player.lastShot = frameCount;
            }
        }

        // Spawner
        const rate = player.isHyper ? 5 : Math.max(15, 60-player.level);
        if(frameCount % rate === 0) getObj(enemies, Enemy).spawn(false);
        
        // Elite Spawn (15초 주기)
        if(frameCount % 900 === 0 && frameCount > 0) {
            getObj(enemies, Enemy).spawn(true);
            warnEl.style.display='block';
            setTimeout(()=>warnEl.style.display='none', 3000);
        }

        // Updates
        bullets.forEach(b=>{
            if(b.active) {
                b.update();
                enemies.forEach(e=>{
                    if(e.active) {
                        const d = Math.hypot(b.wx-e.wx, b.wy-e.wy);
                        if(d < b.r + e.r) {
                            // 데미지 계산
                            const dmg = player.damage * (player.isHyper?2:1);
                            e.hp -= dmg;
                            spawnText(Math.floor(dmg), e.wx, e.wy, 'white');
                            
                            // 넉백 (Knockback) 효과 구현
                            // 총알 방향대로 적을 밀어냄 (엘리트는 덜 밀림)
                            const kbPower = e.isElite ? 0.5 : 4.0;
                            e.wx += b.vx * 0.5 * kbPower; 
                            e.wy += b.vy * 0.5 * kbPower;

                            if(e.hp<=0) {
                                e.active=false;
                                getObj(gems, Gem).spawn(e.wx, e.wy, e.xp);
                                if(e.isElite) {
                                    spawnText("BOSS KILL!", e.wx, e.wy, "#fdcb6e");
                                    addHyper(20);
                                }
                            }
                            b.active=false;
                        }
                    }
                })
            }
        });
        enemies.forEach(e=>{ if(e.active) e.update(); });
        gems.forEach(e=>{ if(e.active) e.update(); });
        texts.forEach(e=>{ if(e.active) e.update(); });
    }

    function draw() {
        drawGrid();

        // Graze Circle
        ctx.strokeStyle = 'rgba(255,255,255,0.1)';
        ctx.beginPath(); ctx.arc(CW/2, CH/2, player.grazeR, 0, Math.PI*2); ctx.stroke();

        gems.forEach(e=>{ if(e.active) e.draw(); });
        bullets.forEach(e=>{ if(e.active) e.draw(); });
        enemies.forEach(e=>{ if(e.active) e.draw(); });
        texts.forEach(e=>{ if(e.active) e.draw(); });

        // Player
        ctx.fillStyle = player.isHyper ? '#fffa65' : player.color;
        if(player.isHyper) { ctx.shadowColor='#fffa65'; ctx.shadowBlur=15; }
        ctx.beginPath(); ctx.arc(CW/2, CH/2, player.r, 0, Math.PI*2); ctx.fill();
        ctx.shadowBlur=0;
    }

    function loop() {
        requestAnimationFrame(loop);
        if(gameState==='PLAY') {
            update();
            draw();
        }
    }

    function levelUp() {
        gameState='PAUSE';
        isTouch=false;
        levelUpScreen.style.display='flex';
        cardsBox.innerHTML='';
        const opts = [
            {t:"공격력 UP", d:"데미지 +5", f:()=>{player.damage+=5}},
            {t:"연사속도 UP", d:"공격속도 +10%", f:()=>{player.baseFireRate*=0.9}},
            {t:"멀티샷", d:"탄환 +1", f:()=>{player.bulletCount++}},
            {t:"이동속도 UP", d:"속도 +10%", f:()=>{player.baseSpeed*=1.1}},
            {t:"체력회복", d:"HP +30", f:()=>{player.hp=Math.min(player.maxHp, player.hp+30)}},
        ];
        
        for(let i=0; i<3; i++) {
            const r = Math.floor(Math.random()*opts.length);
            const item = opts[r];
            const div = document.createElement('div');
            div.className='card';
            div.innerHTML=`<h3>${item.t}</h3><p>${item.d}</p>`;
            div.onclick=()=>{
                item.f();
                levelUpScreen.style.display='none';
                gameState='PLAY';
            };
            cardsBox.appendChild(div);
        }
    }

    function gameOver() {
        gameState='GAMEOVER';
        resultText.innerText = `최종 레벨: ${player.level}`;
        gameOverScreen.style.display='flex';
    }

    loop();

</script>
</body>
</html>
