<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SPARCRUSH</title>
    <style>
        /* 선택 방지 */
        * { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; box-sizing: border-box; }
        body { margin: 0; background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; font-family: 'Segoe UI', sans-serif; color: white; touch-action: none; }
        #gameContainer { position: relative; width: 100vh; max-width: 56.25vh; height: 100vh; background: #0f1218; overflow: hidden; box-shadow: 0 0 30px rgba(0,210,211,0.2); }
        canvas { display: block; width: 100%; height: 100%; }
        #uiLayer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; padding: 15px; display: flex; flex-direction: column; }
        .header-ui { width: 100%; display: flex; flex-direction: column; gap: 5px; }
        .score-row { display: flex; justify-content: space-between; font-size: 14px; font-weight: bold; color: #c8aa6e; text-shadow: 1px 1px 2px #000; }
        #expBarContainer { width: 100%; height: 12px; background: #1e2328; border: 1px solid #c8aa6e; margin-top: 2px; }
        #expBar { height: 100%; width: 0%; background: #0acde5; transition: width 0.1s; }
        .stats { display: flex; justify-content: space-between; font-size: 12px; color: #a0a0a0; margin-top: 4px; }
        
        #infoMsg { position: absolute; top: 80px; left: 15px; pointer-events: none; opacity: 0; transition: opacity 0.1s; display: flex; align-items: center; }
        #infoText { font-size: 18px; font-weight: 800; color: #fff; text-shadow: 1px 1px 3px rgba(0,0,0,0.9); font-family: 'Segoe UI', sans-serif; letter-spacing: 0.5px; }
        #infoIcon { width:20px; height:20px; object-fit:contain; margin-right:5px; display:none; }
        .pop-in { animation: popIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes popIn { 0% { transform: scale(0.8) translateX(-20px); opacity: 0; } 100% { transform: scale(1) translateX(0); opacity: 1; } }

        #centerMsg { position: absolute; top: 20%; left: 50%; transform: translateX(-50%); text-align: center; width: 100%; pointer-events: none; z-index: 5; }
        #comboCount { font-size: 48px; font-weight: 900; color: #fffa65; text-shadow: 0 0 15px rgba(255, 165, 2, 0.8); display: none; transition: transform 0.05s; }
        #comboLabel { font-size: 12px; color: #81ecec; letter-spacing: 3px; font-weight: bold; display:none; text-shadow: 0 0 5px #00cec9; }

        #rightHud { 
            position: absolute; right: 15px; top: 130px; height: 30%; 
            display: flex; flex-direction: column; align-items: center; 
            gap: 2px; 
        }
        
        #typeIcon { 
            width: 20px; height: 20px; 
            margin-top: 2px; 
            object-fit: contain; 
            filter: drop-shadow(0 0 2px rgba(255,255,255,0.3));
        }
        
        #hyperContainer {
            width: 10px; flex: 1; background: rgba(0,0,0,0.6); 
            border: 1px solid #555; 
            border-radius: 0; 
            overflow: hidden; 
            display: flex; flex-direction: column-reverse; 
            box-shadow: 0 0 5px rgba(0,0,0,0.5); 
            transition: box-shadow 0.1s; 
        }
        #hyperFill { width: 100%; height: 0%; background: linear-gradient(to top, #6c5ce7, #a29bfe); transition: height 0.1s linear, filter 0.1s; }
        
        @keyframes gaugeBlink {
            0% { border-color: rgba(255, 255, 255, 0.9); box-shadow: 0 0 4px rgba(255, 255, 255, 0.6); }
            50% { border-color: rgba(255, 0, 0, 0.9); box-shadow: 0 0 4px rgba(255, 0, 0, 0.6); }
            100% { border-color: rgba(255, 255, 255, 0.9); box-shadow: 0 0 4px rgba(255, 255, 255, 0.6); }
        }
        .gauge-charging #hyperContainer { 
            animation: gaugeBlink 0.2s infinite;
        }
        .gauge-charging #hyperFill { filter: brightness(1.2); }

        #dashZone { position: absolute; right: 30px; bottom: 100px; pointer-events: auto; display: flex; flex-direction: column; align-items: center; }
        #dashIcon { width: 70px; height: 70px; border-radius: 50%; border: 3px solid #fff; background: rgba(241, 196, 15, 0.2); display: flex; justify-content: center; align-items: center; color: white; font-weight: bold; font-size: 14px; box-shadow: 0 0 10px rgba(241, 196, 15, 0.3); transition: opacity 0.2s; cursor: pointer; }
        #dashIcon.ready { background: rgba(241, 196, 15, 0.6); opacity: 1; border-color: #fff; }
        #dashIcon.cooldown { background: rgba(0,0,0,0.5); opacity: 0.4; border-color: #555; font-size: 24px;}
        #pcGuide { position: absolute; bottom: 20px; width: 100%; text-align: center; color: #666; font-size: 11px; pointer-events: none; font-weight: bold; }

        .modal { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.6); 
            backdrop-filter: blur(4px);   
            display: none; flex-direction: column; justify-content: center; align-items: center; 
            pointer-events: auto; z-index: 100; 
        }

        .card { 
            background: #0f1218; color: #c8aa6e; 
            width: 240px; 
            margin: 8px auto; 
            padding: 12px 15px; 
            border: 1px solid #c8aa6e; 
            box-shadow: 0 0 10px rgba(200, 170, 110, 0.2); 
            transition: transform 0.1s; cursor: pointer;
            opacity: 0; 
            transform: translateY(20px) scale(0.9);
            animation: cardEntry 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            display: flex; flex-direction: row; align-items: center; text-align: left; 
        }
        @keyframes cardEntry { to { opacity: 1; transform: translateY(0) scale(1); } }

        .card:active { transform: scale(0.98); background: #1e2328; }
        .card.hyper-card { border: 1px solid #0acde5; color: #0acde5; background: #0a1a20;}
        .card-icon { width: 40px; height: 40px; margin-right: 15px; object-fit: contain; flex-shrink: 0; filter: drop-shadow(0 0 5px rgba(255,255,255,0.2)); }
        .card-text-group { display: flex; flex-direction: column; justify-content: center; }
        .card-text-group h3 { margin: 0 0 4px 0; font-size: 16px; line-height: 1.2; }
        .card-text-group p { margin: 0; font-size: 12px; color: #ccc; line-height: 1.2; }

        #gameOverTitle { 
            color: #00f3ff; font-size: 32px; font-weight: 900; 
            margin-top: 20px; 
            margin-bottom: 20px; 
            letter-spacing: 3px; 
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.6);
            font-style: italic;
            /* position: absolute; top: 10%;  (위치 조정) */
            animation: neonPulse 1.5s infinite alternate;
        }
        
        @keyframes neonPulse {
            0% { text-shadow: 0 0 8px rgba(0, 243, 255, 0.5), 0 0 12px rgba(0, 243, 255, 0.3); transform: scale(1); }
            100% { text-shadow: 0 0 15px rgba(0, 243, 255, 0.8), 0 0 25px rgba(0, 243, 255, 0.6), 0 0 35px rgba(0, 243, 255, 0.4); transform: scale(1.02); }
        }

        @keyframes iconBounceAndAttach {
            0% { transform: scale(2.5); opacity: 0; }
            40% { transform: scale(0.7); opacity: 1; }
            60% { transform: scale(1.3); }
            80% { transform: scale(0.85); }
            100% { transform: scale(1); opacity: 1; }
        }

        .icon-attach-anim {
            animation: iconBounceAndAttach 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        
        #newRecordMsg { color: #fffa65; font-size: 18px; font-weight: bold; margin-bottom: 10px; display: none; animation: blink 0.5s infinite alternate; }
        @keyframes blink { from { opacity: 1; } to { opacity: 0.5; } }
        
        #resultContainer { margin-bottom: 10px; text-align: center; }

        #rushTimerBox { margin-top: 5px; text-align: center; }
        #rushCount { font-size: 40px; font-weight: bold; color: #ff7675; min-height: 48px; }
        #rushBtn { margin-top: 10px; cursor: pointer; transition: transform 0.1s; }
        #rushBtn:active { transform: scale(0.95); }
        
        .btn-enhanced {
            padding: 15px 30px; font-size: 18px; font-weight: bold;
            background: #6c5ce7; color: white; border: 2px solid #fff;
            box-shadow: 0 0 15px #6c5ce7;
        }
        
        .btn-reset {
            padding: 12px 24px; font-size: 14px; font-weight: bold;
            background: #555; color: white; border: none;
            box-shadow: none;
        }
        .btn-reset:active { background: #666; }
        #rushSubText { font-size: 12px; color: white; margin-top: 10px; min-height: 15px; }

        .hyper-active #gameContainer { animation: shake 0.2s infinite; }
        @keyframes shake { 0% { transform: translate(1px, 1px); } 50% { transform: translate(-1px, -1px); } 100% { transform: translate(1px, -1px); } }

        #rushBtn {
            position: relative;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        #rushBtnGauge {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            background: #f1c40f;
            width: 0;
        }
        #rushBtnText {
            position: relative;
            z-index: 1;
            white-space: nowrap;
        }
        .btn-enhanced.timed-rush {
            color: #000;
            transition: color 0.1s 4.8s;
        }

        /* --- LEADERBOARD CSS --- */
        #leaderboardContainer {
            width: 85%;
            margin-top: 10px;
            margin-bottom: 15px;
            background: rgba(0,0,0,0.5);
            border: 1px solid #444;
            padding: 10px;
            max-height: 200px;
            overflow-y: auto;
            border-radius: 5px;
        }
        #leaderboardTable {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            color: #ddd;
        }
        #leaderboardTable th {
            text-align: left;
            border-bottom: 1px solid #666;
            padding: 4px;
            color: #0acde5;
        }
        #leaderboardTable td {
            border-bottom: 1px solid #333;
            padding: 4px;
        }
        #leaderboardTable tr:nth-child(1) td { color: #f1c40f; font-weight: bold; font-size: 13px; } /* 1등 금색 */
        #leaderboardTable tr:nth-child(2) td { color: #95a5a6; font-weight: bold; } /* 2등 은색 */
        #leaderboardTable tr:nth-child(3) td { color: #d35400; font-weight: bold; } /* 3등 동색 */
        
        #loadingRank { font-size: 12px; color: #aaa; text-align: center; margin: 10px 0; }
    </style>
</head>
<body>

<div id="gameContainer">
    <canvas id="gameCanvas"></canvas>
    
    <div id="uiLayer">
        <div class="header-ui">
            <div class="score-row"><span>현재 스코어: <span id="scoreVal">0</span></span><span>최고 점수: <span id="bestVal">0</span></span></div>
            <div id="expBarContainer"><div id="expBar"></div></div>
            <div class="stats"><span id="lvText">LV. 1</span><span id="hpText" style="color:#ff7675;">HP: 100</span></div>
        </div>
        
        <div id="infoMsg">
            <img id="infoIcon" src="" alt="Info Icon">
            <div id="infoText"></div>
        </div>
        <div id="centerMsg"><div id="comboCount">0</div><div id="comboLabel">COMBO</div></div>
        
        <div id="rightHud">
            <div id="hyperContainer"><div id="hyperFill"></div></div>
            <img id="typeIcon" src="rapid.png" alt="Skill">
        </div>
        
        <div id="dashZone"><div id="dashIcon" class="ready">DASH</div></div>
        <div id="pcGuide">[PC] Mouse: Move / Space: Dash</div>
    </div>

    <div id="levelUpScreen" class="modal">
        <h2 id="levelUpTitle" style="color:#c8aa6e; margin-bottom:20px; text-shadow: 2px 2px 4px rgba(0,0,0,0.8);">LEVEL UP!</h2>
        <div id="cardsBox" style="width:100%; display:flex; flex-direction:column; align-items:center;"></div>
    </div>

    <div id="gameOverScreen" class="modal">
        <div id="gameOverTitle">SPARCRUSH</div>
        <div id="newRecordMsg" style="text-shadow: 1px 1px 2px rgba(0,0,0,0.8);">🏆 NEW RECORD! 🏆</div>
        
        <div id="resultContainer"></div>

        <div id="leaderboardContainer">
            <div id="loadingRank">Connecting to LootLocker...</div>
            <table id="leaderboardTable">
                <thead>
                    <tr>
                        <th style="width: 15%;">Rank</th>
                        <th>Player</th>
                        <th style="text-align:right;">Score</th>
                    </tr>
                </thead>
                <tbody id="leaderboardBody">
                    </tbody>
            </table>
        </div>

        <div id="rushTimerBox">
            <div id="rushLabel" style="display:none;"></div> 
            <div style="position: relative; display: inline-block; margin-top: 5px;">
                <button id="rushBtn" onclick="rushStart()" style="margin-top: 0;">
                    <span id="rushBtnGauge"></span>
                    <span id="rushBtnText"></span>
                </button>
            </div>
            <div id="rushSubText"></div>
        </div>
    </div>
</div>

<script>
    // ==========================================
    // [LootLocker Config]
    // LootLocker 대시보드에서 확인한 값을 입력하세요.
    // ==========================================
    const LOOTLOCKER_GAME_KEY = "dev_45f9a56c611c47e1be2fcd6e5edecdda"; // Settings > API Keys > Game Key
    const LOOTLOCKER_LEADERBOARD_KEY = "32752"; // Leaderboards > Key (string)
    const GAME_VERSION = "0.1.0";
    
    let llSessionToken = "";
    let llPlayerID = "";

    // [LootLocker] 1. 게스트 로그인
    async function initLootLocker() {
        try {
            const res = await fetch("https://api.lootlocker.io/game/v2/session/guest", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ game_key: LOOTLOCKER_GAME_KEY, game_version: GAME_VERSION })
            });
            const data = await res.json();
            if(data.session_token) {
                llSessionToken = data.session_token;
                llPlayerID = data.player_id;
                console.log("✅ LootLocker Login OK:", llPlayerID);
            } else {
                console.error("❌ LootLocker Login Failed:", data);
            }
        } catch(e) { console.error("Login Error:", e); }
    }

    // [LootLocker] 2. 점수 제출
    async function submitScoreLL(score) {
        if(!llSessionToken) return;
        try {
            document.getElementById('loadingRank').innerText = "Uploading Score...";
            const res = await fetch(`https://api.lootlocker.io/game/leaderboards/${LOOTLOCKER_LEADERBOARD_KEY}/submit`, {
                method: "POST",
                headers: { "Content-Type": "application/json", "x-session-token": llSessionToken },
                body: JSON.stringify({ score: score, metadata: "Player" }) // 메타데이터(예: 캐릭터명) 가능
            });
            const data = await res.json();
            console.log("📤 Score Submitted:", data);
            // 점수 제출이 끝나면 랭킹 목록을 불러옴
            fetchLeaderboardLL();
        } catch(e) { console.error("Submit Error:", e); }
    }

    // [LootLocker] 3. 랭킹 불러오기
    async function fetchLeaderboardLL() {
        if(!llSessionToken) return;
        try {
            document.getElementById('loadingRank').innerText = "Loading Leaderboard...";
            const res = await fetch(`https://api.lootlocker.io/game/leaderboards/${LOOTLOCKER_LEADERBOARD_KEY}/list?count=10`, {
                method: "GET",
                headers: { "x-session-token": llSessionToken }
            });
            const data = await res.json();
            
            const tbody = document.getElementById('leaderboardBody');
            tbody.innerHTML = ""; // 초기화
            
            if(data.items && data.items.length > 0) {
                document.getElementById('loadingRank').style.display = 'none';
                data.items.forEach(item => {
                    const tr = document.createElement('tr');
                    // 플레이어 ID 짧게 표시 (예: Guest_1234)
                    let nameDisplay = item.player.name ? item.player.name : `Guest_${item.player.id}`;
                    if(item.player.id == llPlayerID) nameDisplay += " (ME)"; // 내 점수 표시

                    tr.innerHTML = `
                        <td>${item.rank}</td>
                        <td>${nameDisplay}</td>
                        <td style="text-align:right;">${item.score.toLocaleString()}</td>
                    `;
                    tbody.appendChild(tr);
                });
            } else {
                document.getElementById('loadingRank').innerText = "No Records Yet.";
            }
        } catch(e) { 
            console.error("Fetch Error:", e);
            document.getElementById('loadingRank').innerText = "Error Loading.";
        }
    }

    window.onload = function() {
        initLootLocker(); // 게임 로드시 로그인 시도
    };

    // ==========================================
    // [Game Logic]
    // ==========================================

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    // --- Audio ---
    const bgm = new Audio('hyper.mp3');
    bgm.loop = true; bgm.volume = 0.5;
    let bgmStarted = false;
    function startBgm() {
        if (!bgmStarted || (gameState === 'PLAY' && bgm.paused)) {
            bgm.play().then(() => { bgmStarted = true; }).catch(e => {});
        }
    }
    window.addEventListener('click', startBgm);
    window.addEventListener('touchstart', startBgm);
    window.addEventListener('keydown', startBgm);

    document.addEventListener('visibilitychange', () => {
        if (document.hidden) { bgm.pause(); } 
        else { if (gameState === 'PLAY' && bgmStarted) { bgm.play().catch(e => {}); } }
    });

    // --- Refs ---
    const expBar = document.getElementById('expBar');
    const lvText = document.getElementById('lvText');
    const hpText = document.getElementById('hpText');
    const scoreVal = document.getElementById('scoreVal');
    const bestVal = document.getElementById('bestVal');
    const infoMsg = document.getElementById('infoMsg');
    const infoText = document.getElementById('info
