<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Infinite Survival: Elite Hunt</title>
    <style>
        body {
            margin: 0; background: #050505;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
            user-select: none; touch-action: none; color: white;
        }

        #gameContainer {
            position: relative; width: 100vh; max-width: 56.25vh; height: 100vh;
            background: #111; /* 배경색은 캔버스에서 처리 */
            overflow: hidden; box-shadow: 0 0 30px rgba(0,210,211,0.2);
        }

        canvas { display: block; width: 100%; height: 100%; }

        /* UI 레이어 */
        #uiLayer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; padding: 15px; box-sizing: border-box;
            display: flex; flex-direction: column; justify-content: space-between;
        }

        /* 상단 UI */
        .top-ui { width: 100%; text-shadow: 1px 1px 3px rgba(0,0,0,0.8); }
        #expContainer {
            width: 100%; height: 12px; background: #333;
            border-radius: 6px; overflow: hidden; margin-bottom: 5px; border: 1px solid #555;
        }
        #expBar { height: 100%; width: 0%; background: #00d2d3; transition: width 0.2s; }
        .stats-row { display: flex; justify-content: space-between; font-size: 14px; font-weight: bold; }
        
        /* 콤보 UI */
        #comboContainer {
            position: absolute; top: 15%; left: 50%; transform: translateX(-50%);
            text-align: center; opacity: 0; transition: opacity 0.2s;
        }
        #comboCount { font-size: 48px; font-weight: 900; color: #fffa65; text-shadow: 0 0 10px #e67e22; }
        
        /* 경고 메시지 (보스 등장 시) */
        #warningMsg {
            position: absolute; top: 30%; left: 50%; transform: translate(-50%, -50%);
            color: #ff4757; font-size: 30px; font-weight: 900;
            text-shadow: 0 0 10px red; display: none;
            animation: blink 0.5s infinite alternate;
        }
        @keyframes blink { from { opacity: 1; transform: translate(-50%, -50%) scale(1); } to { opacity: 0.3; transform: translate(-50%, -50%) scale(1.1); } }

        /* 하단 UI */
        .bottom-ui { width: 100%; margin-bottom: 20px; }
        .gauge-wrapper {
            width: 100%; height: 24px; background: #222; border-radius: 12px;
            overflow: hidden; border: 2px solid #444; position: relative;
        }
        #hyperBar {
            height: 100%; width: 0%; background: linear-gradient(90deg, #6c5ce7, #a29bfe);
            transition: width 0.1s linear;
        }
        #hyperText {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            font-size: 12px; font-weight: bold; text-shadow: 0 0 2px black;
        }

        /* 쉐이크 효과 */
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            50% { transform: translate(-1px, -1px) rotate(0deg); }
            100% { transform: translate(1px, -1px) rotate(0deg); }
        }
        .hyper-active #gameContainer { animation: shake 0.2s infinite; }
        .hyper-active #hyperBar { background: linear-gradient(90deg, #ff9f43, #ff6b81) !important; }

        /* 모달 (레벨업/게임오버) */
        .modal {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); display: none;
            flex-direction: column; justify-content: center; align-items: center;
            pointer-events: auto; z-index: 100; backdrop-filter: blur(4px);
        }
        .card {
            background: white; color: #333; width: 85%; margin: 8px 0; padding: 15px;
            border-radius: 10px; cursor: pointer; text-align: center;
            box-shadow: 0 4px 0 #bdc3c7; transition: transform 0.1s;
        }
        .card:active { transform: translateY(4px); box-shadow: 0 0 0; }
        .card h3 { margin: 0 0 4px 0; color: #d63031; }
        .card p { margin: 0; font-size: 12px; color: #555; }
    </style>
</head>
<body>

<div id="gameContainer">
    <canvas id="gameCanvas"></canvas>
    
    <div id="uiLayer">
        <div class="top-ui">
            <div id="expContainer"><div id="expBar"></div></div>
            <div class="stats-row">
                <span id="levelText">LV. 1</span>
                <span id="hpText" style="color:#ff7675;">HP: 100</span>
            </div>
        </div>
        
        <div id="comboContainer">
            <div id="comboCount">0</div>
            <div style="font-size:12px; color:#fff;">COMBO</div>
        </div>

        <div id="warningMsg">⚠ WARNING ⚠<br><span style="font-size:16px; color:white;">ELITE ENEMY DETECTED</span></div>

        <div class="bottom-ui">
            <div style="font-size:12px; color:#a29bfe; margin-bottom:4px;">HYPER GAUGE</div>
            <div class="gauge-wrapper">
                <div id="hyperBar"></div>
                <div id="hyperText">0%</div>
            </div>
        </div>
    </div>

    <div id="levelUpScreen" class="modal">
        <h2 style="color:#fdcb6e;">LEVEL UP!</h2>
        <div id="cardsContainer" style="width:100%; display:flex; flex-direction:column; align-items:center;"></div>
    </div>

    <div id="gameOverScreen" class="modal">
        <h1 style="color: #ff7675;">YOU DIED</h1>
        <h3 id="finalResult" style="color:white; margin-bottom: 30px;"></h3>
        <button onclick="restartGame()" style="padding:15px 40px; font-size:20px; border-radius:30px; border:none; background:#00d2d3; color:white; font-weight:bold; cursor:pointer;">RETRY</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    // UI Elements
    const expBar = document.getElementById('expBar');
    const levelText = document.getElementById('levelText');
    const hpText = document.getElementById('hpText');
    const comboContainer = document.getElementById('comboContainer');
    const comboCountEl = document.getElementById('comboCount');
    const hyperBar = document.getElementById('hyperBar');
    const hyperText = document.getElementById('hyperText');
    const warningMsg = document.getElementById('warningMsg');
    const levelUpScreen = document.getElementById('levelUpScreen');
    const cardsContainer = document.getElementById('cardsContainer');
    const gameOverScreen = document.getElementById('gameOverScreen');

    // Canvas Size
    const CW = 360;
    const CH = 640;
    canvas.width = CW; canvas.height = CH;

    let gameState = 'PLAY';
    let frameCount = 0;
    
    // --- Player & World ---
    // 플레이어의 실제 위치는 worldX, worldY
    // 화면에 그릴 때는 항상 중앙(CW/2, CH/2)에 그림
    const player = {
        wx: 0, wy: 0, // World Coordinates (Infinite)
        r: 8, hitR: 4, grazeR: 35,
        color: '#00d2d3',
        hp: 100, maxHp: 100,
        
        // Movement
        speed: 3, baseSpeed: 3,
        
        // Attack
        damage: 10,
        fireRate: 30, baseFireRate: 30,
        bulletSpeed: 7, bulletCount: 1,
        magnet: 80,
        lastShotTime: 0,
        
        // Progression
        level: 1, exp: 0, nextExp: 10,
        
        // Hyper
        combo: 0, comboTimer: 0,
        hyperGauge: 0, isHyper: false, hyperDuration: 0
    };

    // --- Input (Relative Joystick for Infinite World) ---
    let touchActive = false;
    let tStartX=0, tStartY=0;
    let moveVx = 0, moveVy = 0; // Velocity

    function handleInputStart(cx, cy) {
        if(gameState !== 'PLAY') return;
        touchActive = true;
        tStartX = cx; tStartY = cy;
    }
    function handleInputMove(cx, cy) {
        if(!touchActive || gameState !== 'PLAY') return;
        const dx = cx - tStartX;
        const dy = cy - tStartY;
        
        // 조이스틱처럼 거리와 각도로 속도 결정
        const angle = Math.atan2(dy, dx);
        const dist = Math.min(50, Math.hypot(dx, dy)); // 최대 거리 제한
        
        // 0 ~ 1 사이의 강도
        const power = dist / 50;
        
        moveVx = Math.cos(angle) * power;
        moveVy = Math.sin(angle) * power;
    }
    function handleInputEnd() {
        touchActive = false;
        moveVx = 0; moveVy = 0;
    }

    canvas.addEventListener('mousedown', e => handleInputStart(e.clientX, e.clientY));
    window.addEventListener('mousemove', e => handleInputMove(e.clientX, e.clientY));
    window.addEventListener('mouseup', handleInputEnd);
    
    canvas.addEventListener('touchstart', e => { e.preventDefault(); handleInputStart(e.touches[0].clientX, e.touches[0].clientY); }, {passive:false});
    window.addEventListener('touchmove', e => { if(touchActive) { e.preventDefault(); handleInputMove(e.touches[0].clientX, e.touches[0].clientY); } }, {passive:false});
    window.addEventListener('touchend', handleInputEnd);


    // --- Entities ---
    // 모든 엔티티는 World X/Y를 가짐
    const enemies = [];
    const bullets = [];
    const gems = [];
    const texts = [];

    class Enemy {
        constructor() { this.active = false; }
        spawn(isElite = false) {
            // 플레이어 기준 화면 밖 랜덤 위치 생성
            const angle = Math.random() * Math.PI * 2;
            const dist = 400 + Math.random() * 200; // 화면 밖
            
            this.wx = player.wx + Math.cos(angle) * dist;
            this.wy = player.wy + Math.sin(angle) * dist;
            
            this.isElite = isElite;
            this.active = true;
            this.grazedCooldown = 0;

            if (isElite) {
                // 엘리트 스펙 (빠르고 튼튼함)
                this.hp = 150 + (player.level * 30);
                this.maxHp = this.hp;
                this.speed = player.speed * 1.05; // 플레이어보다 살짝 빠름 (도망 불가)
                this.r = 25;
                this.damage = 30;
                this.color = '#e17055'; // 주황/빨강
                this.xpValue = 50;
            } else {
                // 일반 잡몹
                this.hp = 10 + (player.level * 4);
                this.speed = 1.0 + Math.random() * 1.5;
                this.r = 10;
                this.damage = 10;
                this.color = '#ff6b81';
                this.xpValue = 5;
            }
        }

        update() {
            // 추적 로직
            const angle = Math.atan2(player.wy - this.wy, player.wx - this.wx);
            this.wx += Math.cos(angle) * this.speed;
            this.wy += Math.sin(angle) * this.speed;

            if(this.grazedCooldown > 0)
