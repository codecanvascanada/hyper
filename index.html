<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Survival io</title>
    <style>
        body {
            margin: 0; background: #111;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
            user-select: none; touch-action: none; color: white;
        }

        #gameContainer {
            position: relative; width: 100vh; max-width: 56.25vh; height: 100vh;
            background: #222; overflow: hidden;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
        }

        canvas { display: block; width: 100%; height: 100%; }

        /* UI 레이어 */
        #uiLayer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; padding: 15px; box-sizing: border-box;
        }

        /* 상단 경험치 바 */
        #expContainer {
            width: 100%; height: 20px; background: #333;
            border-radius: 10px; border: 2px solid #555; overflow: hidden; margin-top: 10px;
        }
        #expBar {
            height: 100%; width: 0%; background: #00d2d3;
            transition: width 0.2s;
        }
        #levelText {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            font-weight: bold; text-shadow: 1px 1px 2px black; font-size: 14px;
        }

        /* 레벨업 선택창 (평소엔 숨김) */
        #levelUpScreen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            display: none; flex-direction: column; justify-content: center; align-items: center;
            pointer-events: auto; z-index: 100;
        }
        .card {
            background: #fff; color: #333; width: 80%; margin: 10px 0;
            padding: 20px; border-radius: 8px; cursor: pointer;
            text-align: center; transition: transform 0.1s;
        }
        .card:hover { transform: scale(1.05); background: #eee; }
        .card h3 { margin: 0 0 5px 0; color: #d63031; }
        .card p { margin: 0; font-size: 12px; color: #666; }

        /* 게임오버 */
        #gameOverScreen {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); flex-direction: column; justify-content: center; align-items: center;
            pointer-events: auto; z-index: 200;
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <canvas id="gameCanvas"></canvas>
    
    <div id="uiLayer">
        <div id="expContainer"><div id="expBar"></div></div>
        <div id="levelText">LV. 1</div>
        <div id="hpText" style="margin-top:5px; font-size:12px; color:#ff7675;">HP: 100/100</div>
    </div>

    <div id="levelUpScreen">
        <h2 style="color:#fdcb6e; margin-bottom: 20px;">LEVEL UP!</h2>
        <div id="cardsContainer" style="width:100%; display:flex; flex-direction:column; align-items:center;"></div>
    </div>

    <div id="gameOverScreen">
        <h1 style="color: #ff7675;">YOU DIED</h1>
        <h3 id="finalLevel">Lv. 1</h3>
        <button onclick="restartGame()" style="padding:10px 30px; font-size:18px; border-radius:20px; border:none; background:white; cursor:pointer;">RETRY</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const expBar = document.getElementById('expBar');
    const levelText = document.getElementById('levelText');
    const hpText = document.getElementById('hpText');
    const levelUpScreen = document.getElementById('levelUpScreen');
    const cardsContainer = document.getElementById('cardsContainer');
    const gameOverScreen = document.getElementById('gameOverScreen');

    const GW = 360; // Game Width
    const GH = 640; // Game Height
    canvas.width = GW; canvas.height = GH;

    let gameState = 'PLAY'; // PLAY, PAUSE, GAMEOVER
    let frameCount = 0;
    
    // --- Player ---
    const player = {
        x: GW/2, y: GH/2,
        r: 10, color: '#0984e3',
        hp: 100, maxHp: 100,
        speed: 2.5,
        level: 1, exp: 0, nextExp: 10,
        // Stats
        damage: 10,
        fireRate: 40, // frames per shot (lower is faster)
        bulletSpeed: 5,
        bulletCount: 1, // 멀티샷
        magnet: 50, // 자석 범위
        lastShotTime: 0
    };

    // --- Input (Relative Touch) ---
    let touchActive = false;
    let tStartX=0, tStartY=0, pStartX=0, pStartY=0;
    let targetX = player.x, targetY = player.y;

    canvas.addEventListener('mousedown', e => startInput(e.clientX, e.clientY));
    canvas.addEventListener('mousemove', e => moveInput(e.clientX, e.clientY));
    canvas.addEventListener('mouseup', endInput);
    
    canvas.addEventListener('touchstart', e => { e.preventDefault(); startInput(e.touches[0].clientX, e.touches[0].clientY); }, {passive:false});
    canvas.addEventListener('touchmove', e => { e.preventDefault(); moveInput(e.touches[0].clientX, e.touches[0].clientY); }, {passive:false});
    canvas.addEventListener('touchend', endInput);

    function startInput(cx, cy) {
        if(gameState !== 'PLAY') return;
        touchActive = true;
        tStartX = cx; tStartY = cy;
        pStartX = player.x; pStartY = player.y;
        targetX = player.x; targetY = player.y;
    }
    function moveInput(cx, cy) {
        if(!touchActive || gameState !== 'PLAY') return;
        const rect = canvas.getBoundingClientRect();
        const scale = GW / rect.width;
        const dx = (cx - tStartX) * scale;
        const dy = (cy - tStartY) * scale;
        targetX = pStartX + dx;
        targetY = pStartY + dy;
    }
    function endInput() { touchActive = false; }


    // --- Entities & Pooling ---
    const enemies = [];
    const bullets = [];
    const gems = [];
    const texts = []; // 데미지 폰트 등

    class Enemy {
        constructor() { this.active = false; }
        spawn(type) {
            // 화면 밖 랜덤 위치
            const side = Math.floor(Math.random()*4);
            if(side===0) { this.x = Math.random()*GW; this.y = -20; }
            else if(side===1) { this.x = GW+20; this.y = Math.random()*GH; }
            else if(side===2) { this.x = Math.random()*GW; this.y = GH+20; }
            else { this.x = -20; this.y = Math.random()*GH; }

            // 타입별 스탯 (시간 지나면 강한 적)
            this.hp = 15 + (player.level * 5);
            this.maxHp = this.hp;
            this.speed = 0.8 + (Math.random()*0.5) + (player.level * 0.05);
            this.r = 8;
            this.damage = 5;
            this.color = '#d63031';
            this.xpValue = 5;
            this.active = true;
        }
        update() {
            // 플레이어 추적
            const angle = Math.atan2(player.y - this.y, player.x - this.x);
            this.x += Math.cos(angle) * this.speed;
            this.y += Math.sin(angle) * this.speed;

            // 플레이어 충돌
            const dist = Math.hypot(player.x - this.x, player.y - this.y);
            if(dist < player.r + this.r) {
                player.hp -= this.damage;
                spawnFloatingText(this.damage, player.x, player.y, 'red');
                this.active = false; // 자폭
                updateUI();
                if(player.hp <= 0) endGame();
            }
        }
        draw(ctx) {
            ctx.fillStyle = this.color;
            ctx.fillRect(this.x - this.r, this.y - this.r, this.r*2, this.r*2);
        }
        takeDamage(dmg) {
            this.hp -= dmg;
            spawnFloatingText(dmg, this.x, this.y, 'white');
            if(this.hp <= 0) {
                this.active = false;
                spawnGem(this.x, this.y, this.xpValue);
            }
        }
    }

    class Bullet {
        constructor() { this.active = false; }
        spawn(x, y, angle) {
            this.x = x; this.y = y;
            this.vx = Math.cos(angle) * player.bulletSpeed;
            this.vy = Math.sin(angle) * player.bulletSpeed;
            this.r = 4;
            this.active = true;
            this.life = 100; // 사거리 제한
        }
        update() {
            this.x += this.vx; this.y += this.vy;
            this.life--;
            if(this.life <= 0) this.active = false;
        }
        draw(ctx) {
            ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI*2);
            ctx.fillStyle = '#fdcb6e'; ctx.fill();
        }
    }

    class Gem {
        constructor() { this.active = false; }
        spawn(x, y, val) {
            this.x = x; this.y = y; this.val = val;
            this.active = true;
            this.r = 4;
            this.vx = 0; this.vy = 0;
        }
        update() {
            // 자석 효과
            const dist = Math.hypot(player.x - this.x, player.y - this.y);
            if(dist < player.magnet) {
                this.x += (player.x - this.x) * 0.15;
                this.y += (player.y - this.y) * 0.15;
                if(dist < player.r + this.r) {
                    addExp(this.val);
                    this.active = false;
                }
            }
        }
        draw(ctx) {
            ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI*2);
            ctx.fillStyle = '#55efc4'; ctx.fill();
        }
    }

    class FloatingText {
        constructor() { this.active = false; }
        spawn(text, x, y, color) {
            this.text = text; this.x = x; this.y = y; this.color = color;
            this.life = 30; this.active = true;
        }
        update() {
            this.y -= 1; this.life--;
            if(this.life <= 0) this.active = false;
        }
        draw(ctx) {
            ctx.fillStyle = this.color;
            ctx.font = 'bold 12px Arial';
            ctx.fillText(this.text, this.x, this.y);
        }
    }

    // Pooling Utils
    function spawnEnemy() {
        let e = enemies.find(x => !x.active);
        if(!e) { e = new Enemy(); enemies.push(e); }
        e.spawn();
    }
    function spawnBullet(x, y, angle) {
        let b = bullets.find(x => !x.active);
        if(!b) { b = new Bullet(); bullets.push(b); }
        b.spawn(x, y, angle);
    }
    function spawnGem(x, y, val) {
        let g = gems.find(x => !x.active);
        if(!g) { g = new Gem(); gems.push(g); }
        g.spawn(x, y, val);
    }
    function spawnFloatingText(txt, x, y, c) {
        let t = texts.find(x => !x.active);
        if(!t) { t = new FloatingText(); texts.push(t); }
        t.spawn(txt, x, y, c);
    }

    // --- Game Logic ---

    function fireWeapon() {
        // 가장 가까운 적 찾기
        let nearest = null;
        let minDst = Infinity;
        enemies.forEach(e => {
            if(!e.active) return;
            const d = Math.hypot(player.x - e.x, player.y - e.y);
            if(d < minDst) { minDst = d; nearest = e; }
        });

        if(nearest && minDst < 200) { // 사거리 200
            const angle = Math.atan2(nearest.y - player.y, nearest.x - player.x);
            
            // 멀티샷 처리
            if(player.bulletCount === 1) {
                spawnBullet(player.x, player.y, angle);
            } else {
                // 부채꼴 발사
                const spread = 0.2; 
                const startAngle = angle - (spread * (player.bulletCount-1))/2;
                for(let i=0; i<player.bulletCount; i++) {
                    spawnBullet(player.x, player.y, startAngle + spread*i);
                }
            }
        }
    }

    function addExp(amount) {
        player.exp += amount;
        if(player.exp >= player.nextExp) {
            player.level++;
            player.exp -= player.nextExp;
            player.nextExp = Math.floor(player.nextExp * 1.3);
            showLevelUp();
        }
        updateUI();
    }

    function updateUI() {
        const pct = (player.exp / player.nextExp) * 100;
        expBar.style.width = `${pct}%`;
        levelText.innerText = `LV. ${player.level}`;
        hpText.innerText = `HP: ${Math.floor(player.hp)}/${player.maxHp}`;
    }

    // --- Upgrade System ---
    const upgradeOptions = [
        { name: "파워 업", desc: "공격력 +5", apply: () => { player.damage += 5; } },
        { name: "공격 속도", desc: "공격속도 +15%", apply: () => { player.fireRate = Math.max(5, player.fireRate * 0.85); } },
        { name: "멀티 샷", desc: "투사체 개수 +1", apply: () => { player.bulletCount++; } },
        { name: "스피드 업", desc: "이동속도 +10%", apply: () => { player.speed *= 1.1; } },
        { name: "최대 체력", desc: "Max HP +30 (회복)", apply: () => { player.maxHp += 30; player.hp += 30; } },
        { name: "자석", desc: "아이템 획득 범위 증가", apply: () => { player.magnet += 30; } }
    ];

    function showLevelUp() {
        gameState = 'PAUSE';
        levelUpScreen.style.display = 'flex';
        cardsContainer.innerHTML = '';

        // 랜덤 3개 뽑기
        const pool = [...upgradeOptions];
        for(let i=0; i<3; i++) {
            if(pool.length === 0) break;
            const idx = Math.floor(Math.random() * pool.length);
            const opt = pool.splice(idx, 1)[0];

            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `<h3>${opt.name}</h3><p>${opt.desc}</p>`;
            card.onclick = () => {
                opt.apply();
                levelUpScreen.style.display = 'none';
                gameState = 'PLAY';
                touchActive = false; // 입력 초기화
                targetX = player.x; targetY = player.y;
                loop();
            };
            cardsContainer.appendChild(card);
        }
    }

    // --- Main Loop ---
    function update() {
        if(gameState !== 'PLAY') return;
        frameCount++;

        // 1. Player Move
        player.x += (targetX - player.x) * 0.2;
        player.y += (targetY - player.y) * 0.2;
        player.x = Math.max(player.r, Math.min(GW-player.r, player.x));
        player.y = Math.max(player.r, Math.min(GH-player.r, player.y));

        // 2. Auto Fire
        if(frameCount - player.lastShotTime > player.fireRate) {
            fireWeapon();
            player.lastShotTime = frameCount;
        }

        // 3. Spawner
        // 레벨이 오를수록 적이 더 많이 나옴
        if(frameCount % Math.max(10, 60 - player.level*2) === 0) {
            spawnEnemy();
        }

        // 4. Update Entities
        bullets.forEach(b => {
            if(b.active) {
                b.update();
                // Collision Bullet vs Enemy
                enemies.forEach(e => {
                    if(e.active) {
                        const d = Math.hypot(b.x - e.x, b.y - e.y);
                        if(d < b.r + e.r) {
                            e.takeDamage(player.damage);
                            b.active = false; // 관통력 없음
                        }
                    }
                });
            }
        });

        enemies.forEach(e => { if(e.active) e.update(); });
        gems.forEach(g => { if(g.active) g.update(); });
        texts.forEach(t => { if(t.active) t.update(); });
    }

    function draw() {
        // 잔상 효과 없이 깔끔하게 지움
        ctx.fillStyle = '#222';
        ctx.fillRect(0, 0, GW, GH);

        // 그리드 배경 (이동 느낌 나게)
        ctx.strokeStyle = '#333';
        ctx.beginPath();
        for(let i=0; i<=GW; i+=40) { ctx.moveTo(i,0); ctx.lineTo(i,GH); }
        for(let i=0; i<=GH; i+=40) { ctx.moveTo(0,i); ctx.lineTo(GW,i); }
        ctx.stroke();

        gems.forEach(g => { if(g.active) g.draw(ctx); });
        bullets.forEach(b => { if(b.active) b.draw(ctx); });
        enemies.forEach(e => { if(e.active) e.draw(ctx); });
        
        // Player
        ctx.fillStyle = player.color;
        ctx.beginPath(); ctx.arc(player.x, player.y, player.r, 0, Math.PI*2); ctx.fill();
        // 자석 범위 표시 (아주 옅게)
        ctx.strokeStyle = 'rgba(255,255,255,0.05)';
        ctx.beginPath(); ctx.arc(player.x, player.y, player.magnet, 0, Math.PI*2); ctx.stroke();

        texts.forEach(t => { if(t.active) t.draw(ctx); });
    }

    function loop() {
        if(gameState === 'PLAY') {
            update();
            draw();
            requestAnimationFrame(loop);
        }
    }

    function endGame() {
        gameState = 'GAMEOVER';
        document.getElementById('finalLevel').innerText = `최종 레벨: ${player.level}`;
        gameOverScreen.style.display = 'flex';
    }

    window.restartGame = function() {
        location.reload(); // 간단한 리셋
    }

    updateUI();
    loop();

</script>
</body>
</html>
