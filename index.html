<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Survival Game - Magnet Update</title>
    <style>
        body { margin: 0; overflow: hidden; background: #111; font-family: 'Courier New', Courier, monospace; touch-action: none; }
        canvas { display: block; }

        /* UI Overlays */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        
        /* HUD Elements */
        .hud-text { position: absolute; color: white; font-weight: bold; text-shadow: 2px 2px 0 #000; pointer-events: auto; }
        #score-board { top: 20px; left: 20px; font-size: 20px; }
        #level-display { top: 50px; left: 20px; font-size: 16px; color: #ffd700; }
        
        /* EXP Bar */
        #exp-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 10px; background: #333;
        }
        #exp-bar { width: 0%; height: 100%; background: #00a8ff; transition: width 0.2s; }

        /* [Modified] Hyper Gauge - Moved to Top Right */
        #hyper-gauge-container {
            position: absolute;
            top: 80px; /* Moved from bottom to top (adjusted for spacing) */
            right: 20px;
            width: 200px;
            height: 20px;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid #fff;
            border-radius: 10px;
            overflow: hidden;
            display: none; /* Initially hidden */
        }
        #hyper-fill {
            width: 0%; height: 100%;
            background: linear-gradient(90deg, #ff9f43, #ee5253);
            transition: width 0.1s linear;
        }
        #hyper-text {
            position: absolute; width: 100%; text-align: center; top: 0;
            color: white; font-size: 12px; line-height: 20px; font-weight: bold;
            text-shadow: 1px 1px 2px black;
        }

        /* Level Up Modal */
        #levelup-modal {
            display: none;
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 100;
            flex-direction: column;
            align-items: center; justify-content: center;
            pointer-events: auto;
        }
        #levelup-modal h2 { color: #ffd700; font-size: 2rem; margin-bottom: 30px; animation: pulse 1s infinite; }
        .card-container { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
        .card {
            background: #2f3640; border: 2px solid #555; border-radius: 10px;
            width: 140px; padding: 20px; text-align: center; cursor: pointer;
            color: white; transition: transform 0.2s, border-color 0.2s;
        }
        .card:hover { transform: translateY(-5px); border-color: #ffd700; background: #353b48; }
        .card-icon { font-size: 40px; margin-bottom: 10px; }
        .card-title { font-size: 16px; font-weight: bold; margin-bottom: 10px; color: #f5f6fa; }
        .card-desc { font-size: 12px; color: #dcdde1; line-height: 1.4; }

        /* Pause Button */
        #pause-btn {
            position: absolute; top: 20px; right: 20px;
            background: none; border: 2px solid white; color: white;
            width: 40px; height: 40px; border-radius: 50%;
            font-size: 20px; cursor: pointer; pointer-events: auto;
            z-index: 50;
        }

        /* Mobile Joystick */
        #joystick-zone {
            position: absolute; bottom: 50px; left: 50px; width: 120px; height: 120px;
            background: rgba(255, 255, 255, 0.1); border-radius: 50%;
            display: none; /* Visible on touch */
            pointer-events: auto; touch-action: none;
        }
        #joystick-knob {
            position: absolute; top: 50%; left: 50%; width: 50px; height: 50px;
            background: rgba(255, 255, 255, 0.5); border-radius: 50%;
            transform: translate(-50%, -50%); pointer-events: none;
        }

        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

<div id="ui-layer">
    <div id="exp-container"><div id="exp-bar"></div></div>
    <div id="score-board" class="hud-text">Score: 0</div>
    <div id="level-display" class="hud-text">Lv. 1</div>
    <button id="pause-btn" onclick="togglePause()">⏸</button>

    <div id="hyper-gauge-container">
        <div id="hyper-fill"></div>
        <div id="hyper-text">HYPER READY</div>
    </div>

    <div id="joystick-zone"><div id="joystick-knob"></div></div>
</div>

<div id="levelup-modal">
    <h2>LEVEL UP!</h2>
    <div class="card-container" id="card-container"></div>
</div>

<canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Game State
    let isGameRunning = true;
    let score = 0;
    let frame = 0;
    let enemies = [];
    let particles = [];
    let damageNumbers = [];
    let drops = []; // Exp gems, coins
    let projectiles = [];

    // Player Setup
    const player = {
        x: 0, y: 0, radius: 15, color: '#00d2d3', speed: 3,
        hp: 100, maxHp: 100, exp: 0, maxExp: 20, level: 1,
        // [New] Magnet Range (Default: small, requires touch)
        magnetRange: 40, 
        hyper: 0, maxHyper: 100, isHyperMode: false
    };

    // Input State
    const keys = {};
    const joystick = { active: false, dx: 0, dy: 0, originX: 0, originY: 0 };

    // Resize
    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        player.x = canvas.width / 2;
        player.y = canvas.height / 2;
        if(canvas.width < 800) document.getElementById('joystick-zone').style.display = 'block';
    }
    window.addEventListener('resize', resize);
    resize();

    // --- Controls ---
    window.addEventListener('keydown', e => keys[e.key] = true);
    window.addEventListener('keyup', e => keys[e.key] = false);

    const joyZone = document.getElementById('joystick-zone');
    const joyKnob = document.getElementById('joystick-knob');

    joyZone.addEventListener('touchstart', e => {
        e.preventDefault();
        const touch = e.touches[0];
        const rect = joyZone.getBoundingClientRect();
        joystick.active = true;
        joystick.originX = rect.left + rect.width/2;
        joystick.originY = rect.top + rect.height/2;
        updateJoystick(touch.clientX, touch.clientY);
    });

    joyZone.addEventListener('touchmove', e => {
        e.preventDefault();
        if(joystick.active) updateJoystick(e.touches[0].clientX, e.touches[0].clientY);
    });

    joyZone.addEventListener('touchend', e => {
        e.preventDefault();
        joystick.active = false;
        joystick.dx = 0; joystick.dy = 0;
        joyKnob.style.transform = `translate(-50%, -50%)`;
    });

    function updateJoystick(x, y) {
        const maxDist = 35;
        let dx = x - joystick.originX;
        let dy = y - joystick.originY;
        const dist = Math.sqrt(dx*dx + dy*dy);
        
        if(dist > maxDist) {
            dx = (dx / dist) * maxDist;
            dy = (dy / dist) * maxDist;
        }
        
        joystick.dx = dx / maxDist;
        joystick.dy = dy / maxDist;
        joyKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
    }

    // --- Game Entities ---
    class Enemy {
        constructor() {
            // Spawn logic: Random edge
            const edge = Math.floor(Math.random() * 4);
            if(edge === 0) { this.x = Math.random() * canvas.width; this.y = -30; }
            else if(edge === 1) { this.x = canvas.width + 30; this.y = Math.random() * canvas.height; }
            else if(edge === 2) { this.x = Math.random() * canvas.width; this.y = canvas.height + 30; }
            else { this.x = -30; this.y = Math.random() * canvas.height; }

            this.radius = 12;
            this.color = '#ff6b6b';
            this.speed = 1.5 + Math.random() * 0.5;
            this.hp = 10 + (player.level * 2);
        }
        update() {
            const angle = Math.atan2(player.y - this.x, player.x - this.x); // Simple chase
            // Fix: Simple chase logic was buggy in math, using standard vector
            const dx = player.x - this.x;
            const dy = player.y - this.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            
            if(dist > 0) {
                this.x += (dx/dist) * this.speed;
                this.y += (dy/dist) * this.speed;
            }
        }
        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.fillStyle = this.color;
            ctx.fill();
            ctx.strokeStyle = '#c0392b';
            ctx.stroke();
        }
    }

    class Projectile {
        constructor(x, y, targetX, targetY) {
            this.x = x; this.y = y;
            this.radius = 5;
            this.color = '#feca57';
            this.speed = 7;
            
            const dx = targetX - x;
            const dy = targetY - y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            this.vx = (dx/dist) * this.speed;
            this.vy = (dy/dist) * this.speed;
            this.life = 100;
        }
        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.life--;
        }
        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.fillStyle = this.color;
            ctx.fill();
        }
    }

    class Drop {
        constructor(x, y, type) {
            this.x = x; this.y = y;
            this.type = type; // 'exp'
            this.radius = 6;
            this.color = '#54a0ff'; // Blue for EXP
            this.magnetized = false;
        }
        update() {
            const dx = player.x - this.x;
            const dy = player.y - this.y;
            const dist = Math.sqrt(dx*dx + dy*dy);

            // [Modified] Magnet Logic: Only pull if within player.magnetRange
            // Once magnetized, it stays magnetized until collected
            if (dist < player.magnetRange) {
                this.magnetized = true;
            }

            if (this.magnetized) {
                const speed = 8; // Fly fast to player
                this.x += (dx/dist) * speed;
                this.y += (dy/dist) * speed;

                // Collection
                if(dist < player.radius + 10) {
                    addExp(5);
                    return true; // collected
                }
            }
            return false;
        }
        draw() {
            ctx.beginPath();
            ctx.moveTo(this.x, this.y - this.radius);
            ctx.lineTo(this.x + this.radius, this.y);
            ctx.lineTo(this.x, this.y + this.radius);
            ctx.lineTo(this.x - this.radius, this.y);
            ctx.closePath();
            ctx.fillStyle = this.color;
            ctx.fill();
            // Magnet Range visual debug (optional)
            // ctx.strokeStyle = 'rgba(255,255,255,0.1)'; ctx.stroke(); 
        }
    }

    class DamageText {
        constructor(x, y, dmg) {
            this.x = x; this.y = y;
            this.text = dmg;
            this.life = 30;
            this.vy = -1;
        }
        update() {
            this.y += this.vy;
            this.life--;
        }
        draw() {
            ctx.fillStyle = `rgba(255, 255, 255, ${this.life/30})`;
            ctx.font = 'bold 14px Arial';
            ctx.fillText(this.text, this.x, this.y);
        }
    }

    // --- Core Logic ---

    function spawnEnemy() {
        if(frame % 60 === 0) { // Every 1 sec approx
            enemies.push(new Enemy());
        }
    }

    function autoAttack() {
        if(frame % 40 === 0 && enemies.length > 0) {
            // Find nearest enemy
            let nearest = null;
            let minDist = Infinity;
            enemies.forEach(e => {
                const d = Math.hypot(e.x - player.x, e.y - player.y);
                if(d < minDist) { minDist = d; nearest = e; }
            });

            if(nearest && minDist < 300) { // Range check
                projectiles.push(new Projectile(player.x, player.y, nearest.x, nearest.y));
            }
        }
    }

    function addExp(amount) {
        player.exp += amount;
        if(player.exp >= player.maxExp) {
            player.exp -= player.maxExp;
            player.level++;
            player.maxExp = Math.floor(player.maxExp * 1.2);
            document.getElementById('level-display').innerText = `Lv. ${player.level}`;
            showLevelUp();
        }
        updateUI();
        
        // Fill Hyper Gauge on exp gain (example mechanic)
        player.hyper += 2;
        if(player.hyper >= player.maxHyper) {
            player.hyper = player.maxHyper;
            document.getElementById('hyper-gauge-container').style.display = 'block';
            activateHyperMode(); // Auto activate or wait for input? Let's auto for now
        }
    }

    function activateHyperMode() {
        if(player.isHyperMode) return;
        player.isHyperMode = true;
        document.getElementById('hyper-text').innerText = "HYPER MODE!!";
        document.getElementById('hyper-fill').style.background = "linear-gradient(90deg, #fff, #ffff00)";
        
        // Effect: Projectile frenzy
        const hyperInterval = setInterval(() => {
            if(!player.isHyperMode) { clearInterval(hyperInterval); return; }
            // Shoot random directions
            const tx = player.x + (Math.random()-0.5)*100;
            const ty = player.y + (Math.random()-0.5)*100;
            projectiles.push(new Projectile(player.x, player.y, tx, ty));
        }, 100);

        // Drain
        const drain = setInterval(() => {
            player.hyper -= 1; // Drain speed
            updateUI();
            if(player.hyper <= 0) {
                player.isHyperMode = false;
                document.getElementById('hyper-text').innerText = "HYPER READY";
                document.getElementById('hyper-fill').style.background = "linear-gradient(90deg, #ff9f43, #ee5253)";
                clearInterval(drain);
            }
        }, 100);
    }

    function updateUI() {
        document.getElementById('score-board').innerText = `Score: ${score}`;
        const expPct = (player.exp / player.maxExp) * 100;
        document.getElementById('exp-bar').style.width = `${expPct}%`;
        
        const hyperPct = (player.hyper / player.maxHyper) * 100;
        document.getElementById('hyper-fill').style.width = `${hyperPct}%`;
    }

    // --- Level Up Logic ---
    const levelupModal = document.getElementById('levelup-modal');
    const cardContainer = document.getElementById('card-container');

    const upgradePool = [
        { type: 'speed', name: 'Speed Up', desc: 'Increases movement speed.', icon: '👟' },
        { type: 'power', name: 'Power Up', desc: 'Increases projectile damage.', icon: '⚔️' },
        // [New] Magnet Upgrade added to pool
        { type: 'magnet', name: 'Magnet', desc: 'Increases item pickup range.', icon: '🧲' },
        { type: 'heal', name: 'Heal', desc: 'Recovers 30 HP.', icon: '❤️' }
    ];

    function getUpgradeOptions() {
        // Pick 3 random
        const options = [];
        for(let i=0; i<3; i++) {
            const r = Math.floor(Math.random() * upgradePool.length);
            options.push(upgradePool[r]);
        }
        return options;
    }

    function showLevelUp() {
        isGameRunning = false;
        levelupModal.style.display = 'flex';
        cardContainer.innerHTML = '';
        
        const options = getUpgradeOptions();
        options.forEach(opt => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="card-icon">${opt.icon}</div>
                <div class="card-title">${opt.name}</div>
                <div class="card-desc">${opt.desc}</div>
            `;
            card.onclick = () => selectUpgrade(opt.type);
            cardContainer.appendChild(card);
        });
    }

    function selectUpgrade(type) {
        if(type === 'speed') player.speed += 0.5;
        if(type === 'power') { /* Logic for damage increase needed in projectile */ }
        
        // [New] Magnet Upgrade Logic
        if(type === 'magnet') {
            player.magnetRange += 30; // Increase range significantly
            // Visual feedback could be added here
        }
        
        if(type === 'heal') player.hp = Math.min(player.hp + 30, player.maxHp);

        levelupModal.style.display = 'none';
        isGameRunning = true;
        gameLoop();
    }

    function togglePause() {
        isGameRunning = !isGameRunning;
        if(isGameRunning) gameLoop();
        else {
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(0,0,canvas.width, canvas.height);
            ctx.fillStyle = 'white';
            ctx.font = '30px Arial';
            ctx.fillText("PAUSED", canvas.width/2 - 50, canvas.height/2);
        }
    }

    // --- Main Loop ---
    function update() {
        // Player Movement
        let mx = 0, my = 0;
        if(keys['ArrowUp'] || keys['w']) my = -1;
        if(keys['ArrowDown'] || keys['s']) my = 1;
        if(keys['ArrowLeft'] || keys['a']) mx = -1;
        if(keys['ArrowRight'] || keys['d']) mx = 1;
        
        if(joystick.active) { mx = joystick.dx; my = joystick.dy; }

        player.x += mx * player.speed;
        player.y += my * player.speed;

        // Boundaries
        player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));
        player.y = Math.max(player.radius, Math.min(canvas.height - player.radius, player.y));

        // Entities Update
        spawnEnemy();
        autoAttack();

        // Projectiles
        for(let i = projectiles.length - 1; i >= 0; i--) {
            const p = projectiles[i];
            p.update();
            
            // Collision with Enemy
            let hit = false;
            for(let j = enemies.length - 1; j >= 0; j--) {
                const e = enemies[j];
                const d = Math.hypot(p.x - e.x, p.y - e.y);
                if(d < e.radius + p.radius) {
                    e.hp -= 10; // Damage
                    damageNumbers.push(new DamageText(e.x, e.y, 10));
                    
                    if(e.hp <= 0) {
                        // Drop EXP
                        drops.push(new Drop(e.x, e.y, 'exp'));
                        enemies.splice(j, 1);
                        score += 10;
                        updateUI();
                    }
                    hit = true;
                    break; 
                }
            }

            if(p.life <= 0 || hit) projectiles.splice(i, 1);
        }

        // Drops
        for(let i = drops.length - 1; i >= 0; i--) {
            if(drops[i].update()) {
                drops.splice(i, 1);
            }
        }

        // Damage Text
        for(let i = damageNumbers.length - 1; i >= 0; i--) {
            damageNumbers[i].update();
            if(damageNumbers[i].life <= 0) damageNumbers.splice(i, 1);
        }

        // Enemies chase player
        enemies.forEach(e => e.update());

        frame++;
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Player
        ctx.beginPath();
        ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
        ctx.fillStyle = player.isHyperMode ? '#ffff00' : player.color; // Flash yellow in hyper
        ctx.fill();
        // Magnet Range Visualization (Debug only - helps to see the range)
        /*
        ctx.beginPath();
        ctx.arc(player.x, player.y, player.magnetRange, 0, Math.PI*2);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
        ctx.stroke();
        */

        drops.forEach(d => d.draw());
        enemies.forEach(e => e.draw());
        projectiles.forEach(p => p.draw());
        damageNumbers.forEach(d => d.draw());
    }

    function gameLoop() {
        if(!isGameRunning) return;
        update();
        draw();
        requestAnimationFrame(gameLoop);
    }

    gameLoop();

</script>
</body>
</html>
