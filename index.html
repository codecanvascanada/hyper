<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mobile Optimized Bullet Hell</title>
    <style>
        body {
            margin: 0;
            background-color: #050505;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            color: white;
            font-family: 'Segoe UI', sans-serif;
            user-select: none;
            touch-action: none; /* 브라우저 기본 제스처 차단 */
        }

        #gameContainer {
            position: relative;
            width: 100vh;
            max-width: 56.25vh; /* 9:16 비율 */
            height: 100vh;
            background: radial-gradient(circle at center, #1a1a2e 0%, #000000 100%);
            box-shadow: 0 0 40px rgba(0, 210, 211, 0.1);
            overflow: hidden;
        }

        canvas { display: block; width: 100%; height: 100%; }

        #uiLayer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px;
            box-sizing: border-box;
            z-index: 10;
        }

        /* 점수판 */
        .top-ui { 
            text-align: right; 
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
        #scoreBoard {
            font-size: 36px;
            font-weight: 800;
            color: #fff;
            letter-spacing: 1px;
        }
        .label { font-size: 12px; color: #888; letter-spacing: 2px; text-transform: uppercase;}

        /* 중앙 콤보 */
        #comboContainer {
            position: absolute;
            top: 18%; left: 50%;
            transform: translateX(-50%);
            text-align: center;
            opacity: 0;
            transition: opacity 0.3s;
        }
        #comboCount {
            font-size: 50px;
            font-weight: 900;
            color: #fffa65;
            line-height: 1;
            text-shadow: 0 0 20px rgba(255, 250, 101, 0.5);
        }
        #comboLabel { font-size: 16px; color: #fff; font-weight: bold; }

        /* 하단 게이지 */
        .bottom-ui { width: 100%; }
        .gauge-wrapper {
            position: relative;
            height: 24px;
            background: #222;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
            border: 1px solid #444;
        }
        .gauge-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #4834d4, #686de0);
            transition: width 0.1s linear;
        }
        .gauge-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            font-size: 11px; font-weight: bold; color: rgba(255,255,255,0.7);
        }
        
        /* 모바일 안내 문구 */
        #touchGuide {
            position: absolute; bottom: 80px; width: 100%; 
            text-align: center; color: #555; font-size: 12px;
            animation: blink 2s infinite;
        }
        @keyframes blink { 0%,100%{opacity:0.3} 50%{opacity:0.8} }

        /* 이펙트 레이어 */
        #effectLayer {
            position: absolute; top: 0; left: 0; 
            width: 100%; height: 100%; 
            pointer-events: none;
        }
        .pop-score {
            position: absolute;
            color: #00d2d3;
            font-weight: 900;
            font-size: 32px;
            text-shadow: 0 0 10px rgba(0, 210, 211, 0.8);
            animation: floatUp 1.2s cubic-bezier(0.19, 1, 0.22, 1) forwards;
        }
        @keyframes floatUp {
            0% { transform: translate(-50%, 0) scale(0.5); opacity: 0; }
            20% { transform: translate(-50%, -40px) scale(1.2); opacity: 1; }
            100% { transform: translate(-50%, -100px) scale(1); opacity: 0; }
        }

        /* 게임오버 */
        #gameOverScreen {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            z-index: 100;
            backdrop-filter: blur(5px);
        }
        button {
            background: white; color: black; border: none;
            padding: 16px 48px; font-size: 20px; font-weight: bold;
            cursor: pointer; border-radius: 50px; margin-top: 40px;
            transition: transform 0.1s;
        }
        button:hover { transform: scale(1.05); background: #eee; }

    </style>
</head>
<body>

<div id="gameContainer">
    <canvas id="gameCanvas"></canvas>
    
    <div id="uiLayer">
        <div class="top-ui">
            <div class="label">TOTAL SCORE</div>
            <div id="scoreBoard">0</div>
        </div>
        
        <div id="comboContainer">
            <div id="comboCount">0</div>
            <div id="comboLabel">COMBO</div>
        </div>

        <div id="touchGuide">화면 아무 곳이나 드래그하여 이동</div>

        <div class="bottom-ui">
            <div style="display:flex; justify-content:space-between; margin-bottom:5px;">
                <span class="label" style="color:#ff9f43;">HYPER GAUGE</span>
                <span class="label" id="phaseLabel">PHASE 1 (EASY)</span>
            </div>
            <div class="gauge-wrapper">
                <div class="gauge-fill" id="hyperBar"></div>
                <div class="gauge-overlay" id="hyperText">GRAZE TO FILL</div>
            </div>
        </div>
    </div>

    <div id="effectLayer"></div>

    <div id="gameOverScreen">
        <h1 style="color: #ff6b81; font-size: 48px; margin-bottom: 0;">GAME OVER</h1>
        <p style="color: #888; margin-bottom: 10px;">Relative Touch Control</p>
        <h2 id="finalScore" style="font-size: 32px; color: white;">0</h2>
        <button onclick="restartGame()">RETRY</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    // UI
    const scoreEl = document.getElementById('scoreBoard');
    const comboContainer = document.getElementById('comboContainer');
    const comboCountEl = document.getElementById('comboCount');
    const hyperBar = document.getElementById('hyperBar');
    const hyperText = document.getElementById('hyperText');
    const effectLayer = document.getElementById('effectLayer');
    const gameOverScreen = document.getElementById('gameOverScreen');
    const finalScoreEl = document.getElementById('finalScore');
    const phaseLabel = document.getElementById('phaseLabel');
    const touchGuide = document.getElementById('touchGuide');

    // Resolution
    const GAME_WIDTH = 360;
    const GAME_HEIGHT = 640;
    canvas.width = GAME_WIDTH;
    canvas.height = GAME_HEIGHT;

    // Game Variables
    let score = 0;
    let combo = 0;
    let hyperGauge = 0;
    const MAX_GAUGE = 100;
    let frameCount = 0;
    let isGameOver = false;
    let animationId;
    
    // Player Settings
    const player = {
        x: GAME_WIDTH / 2,
        y: GAME_HEIGHT / 2,
        hitRadius: 3,       
        grazeRadius: 30,    
        visualRadius: 8,
        color: '#00d2d3'
    };

    // Target Position (for smoothing)
    let targetX = GAME_WIDTH / 2;
    let targetY = GAME_HEIGHT / 2;

    // Bullet Pooling
    const MAX_BULLETS = 600;
    const bullets = [];

    class Bullet {
        constructor() {
            this.x = 0; this.y = 0;
            this.vx = 0; this.vy = 0;
            this.radius = 5; 
            this.active = false;
            this.grazed = false;
            this.color = '#ff6b81';
        }
        spawn(x, y, angle, speed) {
            this.x = x; this.y = y;
            this.vx = Math.cos(angle) * speed;
            this.vy = Math.sin(angle) * speed;
            this.active = true;
            this.grazed = false;
            this.color = speed > 5 ? '#ff4757' : '#ff6b81';
        }
        update() {
            if (!this.active) return;
            this.x += this.vx;
            this.y += this.vy;
            if (this.x < -50 || this.x > GAME_WIDTH+50 || this.y < -50 || this.y > GAME_HEIGHT+50) {
                this.active = false;
            }
        }
        draw(ctx) {
            if (!this.active) return;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.fillStyle = this.grazed ? '#535c68' : this.color; 
            ctx.fill();
        }
    }

    for (let i = 0; i < MAX_BULLETS; i++) bullets.push(new Bullet());
    function getInactiveBullet() { return bullets.find(b => !b.active); }

    // --- Input Handling (Relative Touch & Mouse) ---
    
    // Mouse: Absolute (PC)
    function updateMousePos(clientX, clientY) {
        if (isGameOver) return;
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        targetX = (clientX - rect.left) * scaleX;
        targetY = (clientY - rect.top) * scaleY;
        touchGuide.style.display = 'none'; // 마우스 쓰면 가이드 숨김
    }
    
    window.addEventListener('mousemove', e => {
        // 터치 중이 아닐 때만 마우스 입력 받음
        if (!isTouchActive) updateMousePos(e.clientX, e.clientY);
    });

    // Touch: Relative (Mobile)
    let isTouchActive = false;
    let touchStartX = 0;
    let touchStartY = 0;
    let playerStartX = 0;
    let playerStartY = 0;

    canvas.addEventListener('touchstart', e => {
        if (isGameOver) return;
        e.preventDefault(); // 스크롤 방지
        isTouchActive = true;
        
        const touch = e.touches[0];
        touchStartX = touch.clientX;
        touchStartY = touch.clientY;
        
        // 터치 시작 시, 현재 플레이어 위치를 기준으로 잡음 (점프 방지)
        playerStartX = player.x;
        playerStartY = player.y;
        
        // 타겟도 현재 위치로 초기화하여 튀는 현상 방지
        targetX = player.x;
        targetY = player.y;
        
        touchGuide.style.display = 'none';
    }, {passive: false});

    canvas.addEventListener('touchmove', e => {
        if (isGameOver || !isTouchActive) return;
        e.preventDefault();
        
        const touch = e.touches[0];
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;

        // 이동량 계산 (Delta)
        const dx = (touch.clientX - touchStartX) * scaleX;
        const dy = (touch.clientY - touchStartY) * scaleY;

        // 초기 플레이어 위치 + 이동량
        targetX = playerStartX + dx;
        targetY = playerStartY + dy;
    }, {passive: false});

    canvas.addEventListener('touchend', () => {
        isTouchActive = false;
    });


    // --- Game Logic ---

    function getDifficulty() {
        const seconds = frameCount / 60;
        const factor = Math.min(seconds / 120, 1.0); 
        return factor;
    }

    function spawnPattern() {
        const factor = getDifficulty();
        
        if (factor < 0.2) phaseLabel.innerText = "PHASE 1 (WARMING UP)";
        else if (factor < 0.5) phaseLabel.innerText = "PHASE 2 (NORMAL)";
        else if (factor < 0.8) phaseLabel.innerText = "PHASE 3 (HARD)";
        else phaseLabel.innerText = "PHASE 4 (HELL)";
        phaseLabel.style.color = factor > 0.8 ? "#ff4757" : "#888";

        const speed = 2.0 + (factor * 5.0);
        const spawnRate = Math.floor(50 - (factor * 42));
        const count = 1 + Math.floor(factor * 4);

        if (frameCount % spawnRate === 0) {
            for(let i=0; i<count; i++) {
                const b = getInactiveBullet();
                if(!b) return;

                const side = Math.floor(Math.random()*4);
                let sx, sy;
                const margin = 20;
                if(side===0) { sx=Math.random()*GAME_WIDTH; sy=-margin; }
                else if(side===1) { sx=GAME_WIDTH+margin; sy=Math.random()*GAME_HEIGHT; }
                else if(side===2) { sx=Math.random()*GAME_WIDTH; sy=GAME_HEIGHT+margin; }
                else { sx=-margin; sy=Math.random()*GAME_HEIGHT; }

                const angle = Math.atan2(player.y - sy, player.x - sx) + (Math.random()-0.5)*0.2;
                b.spawn(sx, sy, angle, speed);
            }
        }
    }

    function checkCollisions() {
        const p = player;
        bullets.forEach(b => {
            if (!b.active) return;
            
            const dx = p.x - b.x;
            const dy = p.y - b.y;
            const distSq = dx*dx + dy*dy;
            const combinedR = p.hitRadius + b.radius;
            
            if (distSq < combinedR * combinedR) {
                endGame();
                return;
            }

            if (!b.grazed) {
                const grazeDist = p.grazeRadius + b.radius;
                if (distSq < grazeDist * grazeDist) {
                    b.grazed = true;
                    combo++;
                    hyperGauge += 2.5; 
                    if(hyperGauge > MAX_GAUGE) hyperGauge = MAX_GAUGE;
                    updateUI();
                }
            }
        });
    }

    function triggerScore() {
        const bonus = combo * combo * 10; 
        score += bonus;
        showFloatingText(bonus);
        combo = 0;
        hyperGauge = 0;
        updateUI();
    }

    function showFloatingText(val) {
        const el = document.createElement('div');
        el.className = 'pop-score';
        el.innerText = `+${val.toLocaleString()}`;
        el.style.left = '50%';
        el.style.top = '40%';
        effectLayer.appendChild(el);
        setTimeout(() => el.remove(), 1200);
    }

    function updateUI() {
        scoreEl.innerText = score.toLocaleString();
        if (combo > 0) {
            comboContainer.style.opacity = 1;
            comboCountEl.innerText = combo;
            comboCountEl.style.transform = `scale(${1 + Math.min(combo/200, 0.3)})`;
        } else {
            comboContainer.style.opacity = 0;
        }
        hyperBar.style.width = `${hyperGauge}%`;
        
        if (hyperGauge >= 100) {
            hyperBar.style.background = 'linear-gradient(90deg, #f9ca24, #f0932b)';
            hyperText.innerText = "MAX GAUGE - CASH OUT!";
            hyperText.style.color = "#fff";
        } else {
            hyperBar.style.background = 'linear-gradient(90deg, #4834d4, #686de0)';
            hyperText.innerText = `${Math.floor(hyperGauge)}%`;
            hyperText.style.color = "rgba(255,255,255,0.7)";
        }
    }

    function update() {
        if (isGameOver) return;
        frameCount++;

        // 플레이어 이동 (마우스/터치 타겟으로 부드럽게 이동)
        // Lerp 계수를 0.2 -> 0.3으로 올려 반응성 개선
        player.x += (targetX - player.x) * 0.3;
        player.y += (targetY - player.y) * 0.3;
        
        // 화면 제한
        player.x = Math.max(player.visualRadius, Math.min(GAME_WIDTH - player.visualRadius, player.x));
        player.y = Math.max(player.visualRadius, Math.min(GAME_HEIGHT - player.visualRadius, player.y));

        spawnPattern();
        bullets.forEach(b => b.update());
        checkCollisions();

        if (hyperGauge < MAX_GAUGE) hyperGauge += 0.02; 
        if (hyperGauge >= MAX_GAUGE) triggerScore();
        
        updateUI();
    }

    function draw() {
        ctx.fillStyle = '#050505'; 
        ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

        // Graze Range
        ctx.beginPath();
        ctx.arc(player.x, player.y, player.grazeRadius, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.03)';
        ctx.fill();
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
        ctx.lineWidth = 1;
        ctx.stroke();

        bullets.forEach(b => b.draw(ctx));

        if (!isGameOver) {
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.visualRadius, 0, Math.PI*2);
            ctx.fillStyle = player.color;
            ctx.fill();
            // Hitbox
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.hitRadius, 0, Math.PI*2);
            ctx.fillStyle = '#fff';
            ctx.fill();
        }
    }

    function loop() {
        update();
        draw();
        animationId = requestAnimationFrame(loop);
    }

    function endGame() {
        isGameOver = true;
        finalScoreEl.innerText = score.toLocaleString();
        gameOverScreen.style.display = 'flex';
        cancelAnimationFrame(animationId);
    }

    window.restartGame = function() {
        isGameOver = false;
        score = 0;
        combo = 0;
        hyperGauge = 0;
        frameCount = 0;
        effectLayer.innerHTML = '';
        gameOverScreen.style.display = 'none';
        
        player.x = GAME_WIDTH/2;
        player.y = GAME_HEIGHT/2;
        targetX = GAME_WIDTH/2; // 타겟도 리셋
        targetY = GAME_HEIGHT/2;
        
        bullets.forEach(b => b.active = false);

        loop();
    }

    loop();

</script>
</body>
</html>
