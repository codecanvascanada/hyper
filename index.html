<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Survival: Vertical UI</title>
    <style>
        body {
            margin: 0; background: #000;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
            user-select: none; touch-action: none; color: white;
        }

        #gameContainer {
            position: relative; width: 100vh; max-width: 56.25vh; height: 100vh;
            background: #111;
            overflow: hidden; box-shadow: 0 0 30px rgba(0,210,211,0.2);
        }

        canvas { display: block; width: 100%; height: 100%; }

        #uiLayer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; padding: 15px; box-sizing: border-box;
            display: flex; flex-direction: column;
        }

        /* Top Header */
        .header-ui { width: 100%; display: flex; flex-direction: column; gap: 5px; }
        .score-row { 
            display: flex; justify-content: space-between; 
            font-size: 16px; font-weight: 900; 
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }
        .score-val { color: #ffeaa7; }
        .best-val { color: #fab1a0; }

        #expBarContainer {
            width: 100%; height: 8px; background: #333;
            border-radius: 4px; overflow: hidden; border: 1px solid #555;
        }
        #expBar { height: 100%; width: 0%; background: #00d2d3; transition: width 0.1s; }
        .stats { display: flex; justify-content: space-between; font-weight: bold; font-size: 13px; text-shadow: 1px 1px 2px black; margin-top: 2px;}

        /* Center Combo */
        #centerMsg {
            position: absolute; top: 20%; left: 50%; transform: translateX(-50%);
            text-align: center; width: 100%; pointer-events: none;
        }
        #comboCount { 
            font-size: 40px; font-weight: 900; color: #fffa65; 
            text-shadow: 0 0 10px rgba(255, 165, 2, 0.8);
            display: none; transition: transform 0.05s;
        }

        /* Right Side HUD (Fixed) */
        #rightHud {
            position: absolute;
            right: 15px;
            bottom: 40px;
            height: 35%; /* 전체 높이 */
            display: flex;
            flex-direction: column; /* 세로 정렬 (글씨 위, 게이지 아래) */
            align-items: center; /* 중앙 정렬 */
            gap: 5px;
        }

        #hyperLabel {
            color: #a29bfe;
            font-size: 10px;
            font-weight: 900;
            letter-spacing: 1px;
            text-shadow: 1px 1px 2px black;
            text-align: center;
            /* writing-mode: vertical-rl; 만약 글씨도 세로로 세우고 싶으면 주석 해제 */
        }

        #hyperContainer {
            width: 14px;
            flex: 1; /* 남은 높이 모두 사용 */
            background: rgba(0,0,0,0.6);
            border: 2px solid #555; border-radius: 10px;
            overflow: hidden; display: flex; flex-direction: column-reverse;
            box-shadow: 0 0 5px rgba(0,0,0,0.5);
        }

        #hyperFill {
            width: 100%; height: 0%; 
            background: linear-gradient(to top, #6c5ce7, #a29bfe);
            transition: height 0.1s linear;
        }

        /* Modals */
        .modal {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: none;
            flex-direction: column; justify-content: center; align-items: center;
            pointer-events: auto; z-index: 100;
        }
        .card {
            background: white; color: #333; width: 85%; margin: 8px; padding: 15px;
            border-radius: 12px; cursor: pointer; text-align: center;
            box-shadow: 0 4px 0 #bdc3c7; transition: transform 0.1s;
        }
        .card:active { transform: translateY(4px); box-shadow: none; }
        
        .hyper-active #gameContainer { animation: shake 0.2s infinite; }
        .hyper-active #hyperFill { background: linear-gradient(to top, #ff9f43, #ff6b81); box-shadow: 0 0 10px #ff6b81; }
        @keyframes shake { 0% { transform: translate(1px, 1px); } 50% { transform: translate(-1px, -1px); } 100% { transform: translate(1px, -1px); } }

    </style>
</head>
<body>

<div id="gameContainer">
    <canvas id="gameCanvas"></canvas>
    
    <div id="uiLayer">
        <div class="header-ui">
            <div class="score-row">
                <span>SCORE: <span id="scoreVal" class="score-val">0</span></span>
                <span>BEST: <span id="bestVal" class="best-val">0</span></span>
            </div>
            <div id="expBarContainer"><div id="expBar"></div></div>
            <div class="stats">
                <span id="lvText">LV. 1</span>
                <span id="hpText" style="color:#ff7675;">HP: 100</span>
            </div>
        </div>
        
        <div id="centerMsg">
            <div id="comboCount">0 COMBO</div>
        </div>

        <div id="rightHud">
            <div id="hyperLabel">HYPER<br>GAUGE</div> <div id="hyperContainer">
                <div id="hyperFill"></div>
            </div>
        </div>
    </div>

    <div id="levelUpScreen" class="modal">
        <h2 style="color:#fdcb6e; margin-bottom:20px;">LEVEL UP!</h2>
        <div id="cardsBox" style="width:100%; display:flex; flex-direction:column; align-items:center;"></div>
    </div>

    <div id="gameOverScreen" class="modal">
        <h1 style="color: #ff7675;">YOU DIED</h1>
        <h3 id="resultText" style="color:white; margin-bottom: 30px;"></h3>
        <button onclick="location.reload()" style="padding:15px 40px; font-size:20px; border-radius:30px; border:none; background:#00d2d3; color:white; font-weight:bold; cursor:pointer;">RETRY</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    const expBar = document.getElementById('expBar');
    const lvText = document.getElementById('lvText');
    const hpText = document.getElementById('hpText');
    const scoreVal = document.getElementById('scoreVal');
    const bestVal = document.getElementById('bestVal');
    const comboEl = document.getElementById('comboCount');
    const hyperFill = document.getElementById('hyperFill');
    const levelUpScreen = document.getElementById('levelUpScreen');
    const cardsBox = document.getElementById('cardsBox');
    const gameOverScreen = document.getElementById('gameOverScreen');
    const resultText = document.getElementById('resultText');

    const CW = 360, CH = 640;
    canvas.width = CW; canvas.height = CH;

    let highScore = localStorage.getItem('survival_highscore') || 0;
    bestVal.innerText = parseInt(highScore).toLocaleString();

    let gameState = 'PLAY';
    let frameCount = 0;

    const player = {
        wx: 0, wy: 0,
        r: 8, hitR: 4, grazeR: 40,
        color: '#00d2d3',
        hp: 100, maxHp: 100,
        speed: 4.5, baseSpeed: 4.5,
        damage: 10,
        fireRate: 25, baseFireRate: 25,
        bulletCount: 1,
        magnet: 80,
        level: 1, exp: 0, nextExp: 10,
        score: 0,
        combo: 0, comboTimer: 0,
        hyperGauge: 0, isHyper: false, hyperTime: 0,
        lastShot: 0,
        showHpTimer: 0
    };

    let joystick = {
        active: false,
        baseX: 0, baseY: 0,
        stickX: 0, stickY: 0,
        maxRadius: 25,
        vx: 0, vy: 0
    };

    function inputStart(x, y) {
        if(gameState!=='PLAY') return;
        joystick.active = true;
        joystick.baseX = x; joystick.baseY = y;
        joystick.stickX = x; joystick.stickY = y;
        joystick.vx = 0; joystick.vy = 0;
    }

    function inputMove(x, y) {
        if(!joystick.active || gameState!=='PLAY') return;
        const dx = x - joystick.baseX;
        const dy = y - joystick.baseY;
        const dist = Math.hypot(dx, dy);
        const limit = Math.min(dist, joystick.maxRadius);
        const angle = Math.atan2(dy, dx);
        joystick.stickX = joystick.baseX + Math.cos(angle) * limit;
        joystick.stickY = joystick.baseY + Math.sin(angle) * limit;

        if (dist > 5) {
            joystick.vx = Math.cos(angle); 
            joystick.vy = Math.sin(angle);
        } else {
            joystick.vx = 0;
            joystick.vy = 0;
        }
    }

    function inputEnd() {
        joystick.active = false;
        joystick.vx = 0; joystick.vy = 0;
    }

    canvas.addEventListener('mousedown', e=>inputStart(e.clientX, e.clientY));
    window.addEventListener('mousemove', e=>inputMove(e.clientX, e.clientY));
    window.addEventListener('mouseup', inputEnd);
    canvas.addEventListener('touchstart', e=>{e.preventDefault(); inputStart(e.touches[0].clientX, e.touches[0].clientY)}, {passive:false});
    window.addEventListener('touchmove', e=>{if(joystick.active){e.preventDefault(); inputMove(e.touches[0].clientX, e.touches[0].clientY)}}, {passive:false});
    window.addEventListener('touchend', inputEnd);

    const enemies = [];
    const bullets = [];
    const gems = [];
    const texts = [];

    function getObj(arr, Class) {
        let o = arr.find(x=>!x.active);
        if(!o) { o=new Class(); arr.push(o); }
        return o;
    }

    class Enemy {
        constructor() { this.active=false; }
        spawn(isElite) {
            const angle = Math.random() * Math.PI * 2;
            const dist = 480;
            this.wx = player.wx + Math.cos(angle)*dist;
            this.wy = player.wy + Math.sin(angle)*dist;
            this.isElite = isElite;
            this.active = true;
            this.grazeCool = 0;
            
            if(isElite) {
                this.hp = 120 + player.level*20; 
                this.maxHp = this.hp;
                this.speed = player.baseSpeed * 0.7;
                this.r = 28; 
                this.color = '#e17055'; 
                this.xp = 100 + player.level*10;
                this.scoreVal = 500;
                this.pattern = Math.random() > 0.5 ? 0 : 1; 
                this.shootTimer = 0;
                this.patternAngle = 0;
            } else {
                this.hp = 15 + player.level*4;
                this.maxHp = this.hp;
                this.speed = 1.5 + Math.random();
                this.r = 10; this.color = '#ff6b81'; 
                this.xp = 5; this.scoreVal = 10;
            }
        }
        update() {
            const angleToPlayer = Math.atan2(player.wy - this.wy, player.wx - this.wx);
            this.wx += Math.cos(angleToPlayer)*this.speed;
            this.wy += Math.sin(angleToPlayer)*this.speed;
            
            if(this.grazeCool>0) this.grazeCool--;
            const dist = Math.hypot(player.wx-this.wx, player.wy-this.wy);
            
            if(dist < player.hitR + this.r) {
                const dmg = this.isElite?20:10;
                player.hp -= dmg;
                player.showHpTimer = 60;
                spawnText(`-${dmg}`, player.wx, player.wy, 'red');
                if(!this.isElite) this.active=false;
                player.combo=0; updateUI();
                if(player.hp<=0) gameOver();
            }
            else if(dist < player.grazeR + this.r && this.grazeCool<=0) {
                addCombo(1);
                addHyper(this.isElite?5:1);
                this.grazeCool=30;
            }

            if(this.isElite) {
                this.shootTimer--;
                if(this.shootTimer <= 0) {
                    if(this.pattern === 0) {
                        const count = 5;
                        const spread = 0.5; 
                        const startA = angleToPlayer - (spread * (count-1))/2;
                        for(let i=0; i<count; i++) {
                            spawnBullet(this.wx, this.wy, startA + spread*i, true); 
                        }
                        this.shootTimer = 90;
                    } else {
                        for(let i=0; i<3; i++) {
                            const a = this.patternAngle + (Math.PI*2/3)*i;
                            spawnBullet(this.wx, this.wy, a, true);
                        }
                        this.patternAngle += 0.2;
                        this.shootTimer = 10; 
                    }
                }
            }
            if(dist > 1000) this.active=false;
        }
        draw() {
            const sx = this.wx - player.wx + CW/2;
            const sy = this.wy - player.wy + CH/2;
            if(sx<-60||sx>CW+60||sy<-60||sy>CH+60) return;
            
            ctx.beginPath(); ctx.arc(sx, sy, this.r, 0, Math.PI*2);
            ctx.fillStyle = this.color; ctx.fill();
            
            const hpPct = Math.max(0, this.hp / this.maxHp);
            let barW, barH, barY;
            if(this.isElite) {
                ctx.lineWidth=3; ctx.strokeStyle='#fff'; ctx.stroke();
                barW = 40; barH = 6; barY = 40;
            } else {
                barW = 18; barH = 3; barY = 20;
            }
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(sx - barW/2, sy - barY, barW, barH);
            ctx.fillStyle = this.isElite ? '#00d2d3' : '#ff7675';
            ctx.fillRect(sx - barW/2, sy - barY, barW * hpPct, barH);
        }
    }

    class Bullet {
        constructor() { this.active=false; }
        spawn(wx, wy, a, isEnemyBullet=false) {
            this.wx=wx; this.wy=wy; 
            this.isEnemyBullet = isEnemyBullet;
            if(isEnemyBullet) {
                this.vx = Math.cos(a)*4; this.vy = Math.sin(a)*4;
                this.life = 100; this.r = 6; this.color = '#ff9f43';
            } else {
                this.vx = Math.cos(a)*8; this.vy = Math.sin(a)*8;
                this.life = 50; this.r = player.isHyper ? 8 : 4;
                this.color = player.isHyper ? '#fffa65' : '#00d2d3';
            }
            this.active=true;
        }
        update() {
            this.wx+=this.vx; this.wy+=this.vy;
            this.life--; if(this.life<=0) this.active=false;
        }
        draw() {
            const sx = this.wx - player.wx + CW/2;
            const sy = this.wy - player.wy + CH/2;
            if(sx<-20||sx>CW+20||sy<-20||sy>CH+20) return;
            ctx.fillStyle = this.color;
            ctx.beginPath(); ctx.arc(sx, sy, this.r, 0, Math.PI*2); ctx.fill();
            if(this.isEnemyBullet) { ctx.strokeStyle='#fff'; ctx.lineWidth=1; ctx.stroke(); }
        }
    }

    class Gem {
        constructor() { this.active=false; }
        spawn(wx, wy, v, isRare) { 
            this.wx=wx; this.wy=wy; this.val=v; 
            this.isRare = isRare; this.active=true; 
        }
        update() {
            const dist = Math.hypot(player.wx-this.wx, player.wy-this.wy);
            let range = player.magnet;
            let spd = 7;
            if(player.isHyper) { range=1200; spd=15; }
            
            if(dist < range) {
                const a = Math.atan2(player.wy-this.wy, player.wx-this.wx);
                this.wx += Math.cos(a)*spd;
                this.wy += Math.sin(a)*spd;
                if(dist < 20) {
                    addExp(this.val);
                    this.active=false;
                }
            }
            if(dist > 1200) this.active=false;
        }
        draw() {
            const sx = this.wx - player.wx + CW/2;
            const sy = this.wy - player.wy + CH/2;
            if(sx<-20||sx>CW+20||sy<-20||sy>CH+20) return;
            ctx.beginPath(); 
            if(this.isRare) {
                ctx.fillStyle='#f1c40f'; ctx.arc(sx, sy, 10, 0, Math.PI*2);
            } else {
                ctx.fillStyle='#55efc4'; ctx.arc(sx, sy, 6, 0, Math.PI*2);
            }
            ctx.fill();
        }
    }

    class FloatText {
        constructor() { this.active=false; }
        spawn(t, wx, wy, c) { this.t=t; this.wx=wx; this.wy=wy; this.c=c; this.life=40; this.active=true; }
        update() { this.wy-=1; this.life--; if(this.life<=0) this.active=false; }
        draw() {
            const sx = this.wx - player.wx + CW/2;
            const sy = this.wy - player.wy + CH/2;
            ctx.fillStyle=this.c; ctx.font="bold 14px Arial"; ctx.fillText(this.t, sx, sy);
        }
    }

    function spawnText(t, wx, wy, c) { getObj(texts, FloatText).spawn(t, wx, wy, c); }
    function spawnBullet(wx, wy, a, isEnemy=false) { getObj(bullets, Bullet).spawn(wx, wy, a, isEnemy); }

    function addCombo(n) {
        player.combo += n;
        player.comboTimer = 120;
        comboEl.style.display = 'block';
        comboEl.innerText = player.combo + " COMBO";
        comboEl.style.transform = 'scale(1.2)';
        setTimeout(()=>comboEl.style.transform='scale(1)', 100);
    }
    
    function addHyper(n) {
        if(player.isHyper) return;
        player.hyperGauge = Math.min(100, player.hyperGauge+n);
        if(player.hyperGauge>=100) {
            player.isHyper=true; player.hyperTime=300;
            document.body.classList.add('hyper-active');
            spawnText("HYPER MODE!", player.wx, player.wy-40, "#fffa65");
        }
        updateUI();
    }

    function addExp(n) {
        player.exp += n;
        if(player.exp >= player.nextExp) {
            player.level++;
            player.exp=0; 
            player.nextExp = Math.floor(player.nextExp*1.4);
            levelUp();
        }
        updateUI();
    }

    function addScore(val) {
        player.score += val;
        scoreVal.innerText = player.score.toLocaleString();
    }

    function updateUI() {
        expBar.style.width = (player.exp/player.nextExp)*100 + "%";
        lvText.innerText = "LV. " + player.level;
        hpText.innerText = "HP: " + Math.floor(player.hp);
        hyperFill.style.height = player.hyperGauge + "%";
    }

    function drawGrid() {
        ctx.fillStyle = '#111';
        ctx.fillRect(0, 0, CW, CH);
        ctx.strokeStyle = '#222';
        ctx.lineWidth = 2;
        ctx.beginPath();
        const sz = 60;
        const offX = ((player.wx % sz) + sz) % sz;
        const offY = ((player.wy % sz) + sz) % sz;
        for(let x = -offX; x < CW; x += sz) { ctx.moveTo(x, 0); ctx.lineTo(x, CH); }
        for(let y = -offY; y < CH; y += sz) { ctx.moveTo(0, y); ctx.lineTo(CW, y); }
        ctx.stroke();
    }

    function drawJoystick() {
        if(!joystick.active) return;
        ctx.beginPath(); ctx.arc(joystick.baseX, joystick.baseY, joystick.maxRadius, 0, Math.PI*2);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)'; ctx.lineWidth = 4; ctx.stroke();
        ctx.beginPath(); ctx.arc(joystick.stickX, joystick.stickY, 20, 0, Math.PI*2);
        ctx.fillStyle = 'rgba(0, 210, 211, 0.8)'; ctx.fill();
    }

    function update() {
        if(gameState!=='PLAY') return;
        frameCount++;

        const spd = player.isHyper ? player.baseSpeed*1.5 : player.baseSpeed;
        player.wx += joystick.vx * spd;
        player.wy += joystick.vy * spd;

        if(player.isHyper) {
            player.hyperTime--;
            player.hyperGauge = (player.hyperTime/300)*100;
            if(player.hyperTime<=0) {
                player.isHyper=false; player.hyperGauge=0;
                document.body.classList.remove('hyper-active');
            }
            updateUI();
        }
        if(player.combo>0) {
            player.comboTimer--;
            if(player.comboTimer<=0) { player.combo=0; comboEl.style.display='none'; }
        }

        const fr = player.isHyper ? 4 : player.baseFireRate;
        if(frameCount - player.lastShot > fr) {
            let t=null, min=Infinity;
            enemies.forEach(e=>{
                if(!e.active) return;
                const d = Math.hypot(player.wx-e.wx, player.wy-e.wy);
                if(d<min) { min=d; t=e; }
            });
            if(t && min<400) {
                const a = Math.atan2(t.wy-player.wy, t.wx-player.wx);
                const spread = 0.2;
                const startA = a - (spread*(player.bulletCount-1))/2;
                for(let i=0; i<player.bulletCount; i++) {
                    spawnBullet(player.wx, player.wy, startA + spread*i, false);
                }
                player.lastShot = frameCount;
            }
        }

        const rate = player.isHyper ? 5 : Math.max(15, 60-player.level);
        if(frameCount % rate === 0) getObj(enemies, Enemy).spawn(false);
        if(frameCount % 600 === 0 && frameCount > 0) getObj(enemies, Enemy).spawn(true);

        bullets.forEach(b=>{
            if(b.active) {
                b.update();
                if(b.isEnemyBullet) {
                    const d = Math.hypot(b.wx-player.wx, b.wy-player.wy);
                    if(d < player.hitR + b.r) {
                        player.hp -= 10;
                        player.showHpTimer = 60;
                        spawnText("-10", player.wx, player.wy, 'red');
                        player.combo=0; updateUI();
                        b.active=false;
                        if(player.hp<=0) gameOver();
                    }
                } else {
                    enemies.forEach(e=>{
                        if(e.active) {
                            const d = Math.hypot(b.wx-e.wx, b.wy-e.wy);
                            if(d < b.r + e.r) {
                                const dmg = player.damage * (player.isHyper?2:1);
                                e.hp -= dmg;
                                spawnText(Math.floor(dmg), e.wx, e.wy, 'white');
                                const kbPower = e.isElite ? 0.3 : 4.0;
                                e.wx += b.vx * 0.5 * kbPower; 
                                e.wy += b.vy * 0.5 * kbPower;
                                if(e.hp<=0) {
                                    e.active=false;
                                    addScore(e.scoreVal);
                                    getObj(gems, Gem).spawn(e.wx, e.wy, e.xp, e.isElite);
                                    if(e.isElite) {
                                        spawnText("ELITE KILLED!", e.wx, e.wy, "#fdcb6e");
                                        addHyper(20);
                                    }
                                }
                                b.active=false;
                            }
                        }
                    })
                }
            }
        });
        enemies.forEach(e=>{ if(e.active) e.update(); });
        gems.forEach(e=>{ if(e.active) e.update(); });
        texts.forEach(e=>{ if(e.active) e.update(); });
    }

    function draw() {
        drawGrid();
        ctx.strokeStyle = 'rgba(255,255,255,0.1)';
        ctx.beginPath(); ctx.arc(CW/2, CH/2, player.grazeR, 0, Math.PI*2); ctx.stroke();
        gems.forEach(e=>{ if(e.active) e.draw(); });
        bullets.forEach(e=>{ if(e.active) e.draw(); });
        enemies.forEach(e=>{ if(e.active) e.draw(); });
        texts.forEach(e=>{ if(e.active) e.draw(); });

        ctx.fillStyle = player.isHyper ? '#fffa65' : player.color;
        if(player.isHyper) { ctx.shadowColor='#fffa65'; ctx.shadowBlur=15; }
        ctx.beginPath(); ctx.arc(CW/2, CH/2, player.r, 0, Math.PI*2); ctx.fill();
        ctx.shadowBlur=0;

        if(player.showHpTimer > 0) {
            player.showHpTimer--;
            const hpPct = Math.max(0, player.hp / player.maxHp);
            const bx = CW/2, by = CH/2 - 25;
            const bw = 30, bh = 4;
            ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(bx - bw/2, by, bw, bh);
            ctx.fillStyle = '#ff7675'; ctx.fillRect(bx - bw/2, by, bw * hpPct, bh);
        }
        drawJoystick();
    }

    function loop() {
        requestAnimationFrame(loop);
        if(gameState==='PLAY') { update(); draw(); }
    }

    function levelUp() {
        gameState='PAUSE';
        joystick.active=false; joystick.vx=0; joystick.vy=0;
        levelUpScreen.style.display='flex';
        cardsBox.innerHTML='';
        const opts = [
            {t:"공격력 UP", d:"데미지 +5", f:()=>{player.damage+=5}},
            {t:"연사속도 UP", d:"공격속도 +10%", f:()=>{player.baseFireRate*=0.9}},
            {t:"멀티샷", d:"탄환 +1", f:()=>{player.bulletCount++}},
            {t:"이동속도 UP", d:"속도 +10%", f:()=>{player.baseSpeed*=1.1}},
            {t:"체력회복", d:"HP +30", f:()=>{player.hp=Math.min(player.maxHp, player.hp+30)}},
        ];
        for(let i=0; i<3; i++) {
            const r = Math.floor(Math.random()*opts.length);
            const item = opts[r];
            const div = document.createElement('div');
            div.className='card';
            div.innerHTML=`<h3>${item.t}</h3><p>${item.d}</p>`;
            div.onclick=()=>{
                item.f(); levelUpScreen.style.display='none'; gameState='PLAY';
            };
            cardsBox.appendChild(div);
        }
    }

    function gameOver() {
        gameState='GAMEOVER';
        if(player.score > highScore) {
            highScore = player.score;
            localStorage.setItem('survival_highscore', highScore);
        }
        resultText.innerText = `SCORE: ${player.score.toLocaleString()}\nBEST: ${parseInt(highScore).toLocaleString()}`;
        gameOverScreen.style.display='flex';
    }

    loop();
</script>
</body>
</html>
